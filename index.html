<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Marble Race</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    select, button {
      font-size: 1rem;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    select {
      background: #16213e;
      color: #eee;
      border: 1px solid #0f3460;
    }

    button {
      background: #0f3460;
      color: #eee;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) { background: #e94560; }
    button:disabled { opacity: 0.4; cursor: default; }

    .vs { font-weight: 700; font-size: 1.1rem; }

    .scoreboard {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 1.4rem;
      font-weight: 700;
      min-height: 40px;
    }

    .scoreboard .team-score {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scoreboard .team-score .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-block;
    }

    .scoreboard .timer {
      font-size: 1.1rem;
      color: #aaa;
      min-width: 50px;
      text-align: center;
    }

    canvas {
      border: 3px solid #333;
      border-radius: 4px;
      background: #0b6623;
      display: block;
      max-width: 100%;
    }

    .replay-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .replay-controls input[type="range"] {
      width: 300px;
      accent-color: #e94560;
    }

    .goal-flash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px rgba(255,255,255,0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
    }

    .goal-flash.visible { opacity: 1; }

    .match-log {
      margin-top: 12px;
      max-width: 900px;
      width: 100%;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>Football Marble Race</h1>

<div class="controls">
  <select id="teamA"></select>
  <span class="vs">VS</span>
  <select id="teamB"></select>
  <button id="start">Gioca partita</button>
  <button id="downloadReplay" disabled>Scarica Replay</button>
</div>

<div class="scoreboard" id="scoreboard"></div>

<canvas id="game" width="900" height="500"></canvas>

<div class="replay-controls" id="replayControls" style="display:none;">
  <button id="replayPlay">Riproduci</button>
  <button id="replayPause">Pausa</button>
  <input type="range" id="replaySlider" min="0" max="100" value="0" />
  <span id="replayTime">0:00</span>
</div>

<div class="goal-flash" id="goalFlash">GOL!</div>
<div class="match-log" id="matchLog"></div>

<script>
// ─── Configuration ──────────────────────────────────────────────
const MATCH_DURATION = 60;        // seconds
const BALL_RADIUS = 14;
const MARBLE_RADIUS = 20;
const GOAL_WIDTH = 10;
const GOAL_HEIGHT = 140;
const FIELD_LINE_COLOR = "rgba(255,255,255,0.25)";
const FPS = 60;
const FRAME_MS = 1000 / FPS;

// ─── Teams ──────────────────────────────────────────────────────
const teams = [
  { name: "Milan",     color: "#AC1E2D", accent: "#000",    power: 1.00 },
  { name: "Inter",     color: "#0055A4", accent: "#000",    power: 1.05 },
  { name: "Juventus",  color: "#000000", accent: "#fff",    power: 1.03 },
  { name: "Roma",      color: "#8E1F2F", accent: "#F0BC42", power: 0.98 },
  { name: "Napoli",    color: "#1E90FF", accent: "#fff",    power: 1.04 },
  { name: "Lazio",     color: "#87CEEB", accent: "#fff",    power: 0.97 },
  { name: "Fiorentina",color: "#6A0DAD", accent: "#fff",    power: 0.96 },
  { name: "Atalanta",  color: "#1C1C1C", accent: "#0074D9", power: 1.01 },
  { name: "Torino",    color: "#8B0000", accent: "#fff",    power: 0.95 },
  { name: "Bologna",   color: "#A41E35", accent: "#1B3D6D", power: 0.94 },
];

// ─── DOM ────────────────────────────────────────────────────────
const canvas   = document.getElementById("game");
const ctx      = canvas.getContext("2d");
const selA     = document.getElementById("teamA");
const selB     = document.getElementById("teamB");
const btnStart = document.getElementById("start");
const btnDL    = document.getElementById("downloadReplay");
const scoreboard   = document.getElementById("scoreboard");
const goalFlashEl  = document.getElementById("goalFlash");
const matchLogEl   = document.getElementById("matchLog");
const replayDiv    = document.getElementById("replayControls");
const replaySlider = document.getElementById("replaySlider");
const replayTimeEl = document.getElementById("replayTime");
const btnReplayPlay  = document.getElementById("replayPlay");
const btnReplayPause = document.getElementById("replayPause");

// Populate selectors
teams.forEach((t, i) => {
  selA.appendChild(new Option(t.name, i));
  selB.appendChild(new Option(t.name, i));
});
selB.value = 1; // default: second team

// ─── Game State ─────────────────────────────────────────────────
let gameRunning = false;
let replayMode  = false;
let animFrameId = null;
let matchTimer  = 0;
let lastTimestamp = 0;
let scoreA = 0;
let scoreB = 0;
let marbleA = null;
let marbleB = null;
let ball = null;
let goalCooldown = 0;  // frames to wait after a goal before resuming

// Goal geometry
const goalY = (canvas.height - GOAL_HEIGHT) / 2;
const goalLeft  = { x: 0,                    y: goalY, w: GOAL_WIDTH, h: GOAL_HEIGHT };
const goalRight = { x: canvas.width - GOAL_WIDTH, y: goalY, w: GOAL_WIDTH, h: GOAL_HEIGHT };

// ─── Replay Data ────────────────────────────────────────────────
let replayData = { teams: {}, frames: [], goals: [] };
let replayIdx  = 0;
let replayPlaying = false;
let replayAnimId  = null;

// ─── Ball ───────────────────────────────────────────────────────
class Ball {
  constructor() {
    this.radius = BALL_RADIUS;
    this.reset();
  }

  reset() {
    this.x = canvas.width / 2;
    this.y = canvas.height / 2;
    this.vx = 0;
    this.vy = 0;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    // Friction
    this.vx *= 0.995;
    this.vy *= 0.995;

    // Wall bounces (top/bottom)
    if (this.y - this.radius < 0) {
      this.y = this.radius;
      this.vy *= -0.8;
    }
    if (this.y + this.radius > canvas.height) {
      this.y = canvas.height - this.radius;
      this.vy *= -0.8;
    }

    // Side walls (outside goal areas)
    if (this.x - this.radius < 0) {
      this.x = this.radius;
      this.vx *= -0.8;
    }
    if (this.x + this.radius > canvas.width) {
      this.x = canvas.width - this.radius;
      this.vx *= -0.8;
    }
  }

  draw() {
    // Ball shadow
    ctx.beginPath();
    ctx.arc(this.x + 2, this.y + 2, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fill();

    // White ball
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.strokeStyle = "#999";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Pentagon pattern (simplified)
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
      const px = this.x + Math.cos(angle) * (this.radius * 0.5);
      const py = this.y + Math.sin(angle) * (this.radius * 0.5);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.fill();
  }
}

// ─── Marble ─────────────────────────────────────────────────────
class Marble {
  constructor(team, startX) {
    this.team = team;
    this.radius = MARBLE_RADIUS;
    this.x = startX;
    this.y = canvas.height / 2;
    this.vx = 0;
    this.vy = 0;
    this.targetX = startX;
    this.targetY = canvas.height / 2;
    this.thinkTimer = 0;
  }

  // Simple AI: move toward ball, with some randomness
  think(ball, ownGoal, opponentGoal) {
    this.thinkTimer--;
    if (this.thinkTimer > 0) return;
    this.thinkTimer = Math.floor(10 + Math.random() * 20);

    const toBallX = ball.x - this.x;
    const toBallY = ball.y - this.y;
    const distBall = Math.sqrt(toBallX * toBallX + toBallY * toBallY);

    // Bias toward pushing ball toward opponent goal
    const goalCenterX = opponentGoal.x + opponentGoal.w / 2;
    const goalCenterY = opponentGoal.y + opponentGoal.h / 2;

    if (distBall < 200) {
      // Go toward ball but offset to push it goalward
      const pushAngle = Math.atan2(goalCenterY - ball.y, goalCenterX - ball.x);
      this.targetX = ball.x - Math.cos(pushAngle) * 40;
      this.targetY = ball.y - Math.sin(pushAngle) * 40;
    } else {
      // Return toward defensive position when far from ball
      const homeX = ownGoal.x < canvas.width / 2 ? canvas.width * 0.3 : canvas.width * 0.7;
      this.targetX = homeX + (Math.random() - 0.5) * 80;
      this.targetY = canvas.height / 2 + (Math.random() - 0.5) * 150;
    }
  }

  update() {
    // Accelerate toward target
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 1) {
      const accel = 0.3 * this.team.power;
      this.vx += (dx / dist) * accel;
      this.vy += (dy / dist) * accel;
    }

    // Speed cap
    const maxSpeed = 4.5 * this.team.power;
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > maxSpeed) {
      this.vx = (this.vx / speed) * maxSpeed;
      this.vy = (this.vy / speed) * maxSpeed;
    }

    // Friction
    this.vx *= 0.97;
    this.vy *= 0.97;

    this.x += this.vx;
    this.y += this.vy;

    // Wall constraints
    if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -0.5; }
    if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -0.5; }
    if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -0.5; }
    if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy *= -0.5; }
  }

  draw() {
    // Shadow
    ctx.beginPath();
    ctx.arc(this.x + 2, this.y + 2, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fill();

    // Main circle
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.team.color;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Team initial
    ctx.fillStyle = this.team.accent;
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(this.team.name[0], this.x, this.y);
  }
}

// ─── Collision Detection ────────────────────────────────────────
function circleCollision(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const minDist = a.radius + b.radius;
  return dist < minDist ? { dx, dy, dist, minDist } : null;
}

function resolveElasticCollision(a, b, massA, massB) {
  const col = circleCollision(a, b);
  if (!col) return false;

  const { dx, dy, dist, minDist } = col;
  if (dist === 0) return false; // prevent division by zero

  // Normal vector
  const nx = dx / dist;
  const ny = dy / dist;

  // Separate overlapping objects
  const overlap = (minDist - dist) / 2;
  a.x -= nx * overlap;
  a.y -= ny * overlap;
  b.x += nx * overlap;
  b.y += ny * overlap;

  // Relative velocity along collision normal
  const dvx = a.vx - b.vx;
  const dvy = a.vy - b.vy;
  const relNormal = dvx * nx + dvy * ny;

  // Don't resolve if moving apart
  if (relNormal < 0) return true;

  const restitution = 0.85;
  const impulse = (2 * relNormal) / (massA + massB) * restitution;

  a.vx -= impulse * massB * nx;
  a.vy -= impulse * massB * ny;
  b.vx += impulse * massA * nx;
  b.vy += impulse * massA * ny;

  return true;
}

// ─── Goal Detection ─────────────────────────────────────────────
function isInGoal(ball, goal) {
  return (
    ball.x - ball.radius < goal.x + goal.w &&
    ball.x + ball.radius > goal.x &&
    ball.y > goal.y &&
    ball.y < goal.y + goal.h
  );
}

// ─── Drawing Helpers ────────────────────────────────────────────
function drawField() {
  // Grass pattern
  ctx.fillStyle = "#0b6623";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Alternating grass stripes
  for (let i = 0; i < 10; i++) {
    if (i % 2 === 0) {
      ctx.fillStyle = "rgba(255,255,255,0.02)";
      ctx.fillRect(i * (canvas.width / 10), 0, canvas.width / 10, canvas.height);
    }
  }

  ctx.strokeStyle = FIELD_LINE_COLOR;
  ctx.lineWidth = 2;

  // Outer boundary
  ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);

  // Center line
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 4);
  ctx.lineTo(canvas.width / 2, canvas.height - 4);
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
  ctx.stroke();

  // Center dot
  ctx.beginPath();
  ctx.arc(canvas.width / 2, canvas.height / 2, 4, 0, Math.PI * 2);
  ctx.fillStyle = FIELD_LINE_COLOR;
  ctx.fill();

  // Penalty areas
  const penaltyW = 70;
  const penaltyH = 220;
  const penaltyY = (canvas.height - penaltyH) / 2;
  ctx.strokeRect(4, penaltyY, penaltyW, penaltyH);
  ctx.strokeRect(canvas.width - penaltyW - 4, penaltyY, penaltyW, penaltyH);

  // Goal areas
  drawGoal(goalLeft, marbleA ? marbleA.team.color : "#ccc");
  drawGoal(goalRight, marbleB ? marbleB.team.color : "#ccc");
}

function drawGoal(goal, teamColor) {
  // Goal net (back)
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

  // Goal posts
  ctx.fillStyle = "#fff";
  ctx.fillRect(goal.x, goal.y - 3, goal.w, 6);             // top post
  ctx.fillRect(goal.x, goal.y + goal.h - 3, goal.w, 6);    // bottom post

  // Colored indicator
  ctx.fillStyle = teamColor;
  ctx.globalAlpha = 0.4;
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
  ctx.globalAlpha = 1.0;
}

function updateScoreboard(timeLeft) {
  if (!marbleA || !marbleB) { scoreboard.innerHTML = ""; return; }
  const mins = Math.floor(timeLeft / 60);
  const secs = Math.floor(timeLeft % 60);
  const timeStr = `${mins}:${secs.toString().padStart(2, "0")}`;

  scoreboard.innerHTML = `
    <span class="team-score">
      <span class="dot" style="background:${marbleA.team.color}"></span>
      ${marbleA.team.name} ${scoreA}
    </span>
    <span class="timer">${timeStr}</span>
    <span class="team-score">
      ${scoreB} ${marbleB.team.name}
      <span class="dot" style="background:${marbleB.team.color}"></span>
    </span>
  `;
}

function showGoalFlash() {
  goalFlashEl.classList.add("visible");
  setTimeout(() => goalFlashEl.classList.remove("visible"), 1200);
}

function logEvent(msg) {
  matchLogEl.textContent = msg;
}

// ─── Reset Positions After Goal ─────────────────────────────────
function resetPositions() {
  marbleA.x = canvas.width * 0.25;
  marbleA.y = canvas.height / 2;
  marbleA.vx = 0;
  marbleA.vy = 0;
  marbleA.thinkTimer = 0;

  marbleB.x = canvas.width * 0.75;
  marbleB.y = canvas.height / 2;
  marbleB.vx = 0;
  marbleB.vy = 0;
  marbleB.thinkTimer = 0;

  ball.reset();
}

// ─── Record Frame for Replay ────────────────────────────────────
function recordFrame() {
  replayData.frames.push({
    mA: { x: marbleA.x, y: marbleA.y },
    mB: { x: marbleB.x, y: marbleB.y },
    ball: { x: ball.x, y: ball.y },
    scoreA,
    scoreB,
    time: matchTimer
  });
}

// ─── Main Game Loop ─────────────────────────────────────────────
function gameLoop(timestamp) {
  if (!gameRunning) return;

  if (!lastTimestamp) lastTimestamp = timestamp;
  const delta = timestamp - lastTimestamp;

  if (delta >= FRAME_MS) {
    lastTimestamp = timestamp;
    matchTimer += delta / 1000;
    const timeLeft = Math.max(0, MATCH_DURATION - matchTimer);

    // Goal cooldown (brief pause after scoring)
    if (goalCooldown > 0) {
      goalCooldown--;
      drawField();
      marbleA.draw();
      marbleB.draw();
      ball.draw();
      updateScoreboard(timeLeft);
      recordFrame();
      animFrameId = requestAnimationFrame(gameLoop);
      return;
    }

    // AI decisions
    marbleA.think(ball, goalLeft, goalRight);
    marbleB.think(ball, goalRight, goalLeft);

    // Update positions
    marbleA.update();
    marbleB.update();
    ball.update();

    // Collisions: marble ↔ ball
    resolveElasticCollision(marbleA, ball, 2.0, 1.0);
    resolveElasticCollision(marbleB, ball, 2.0, 1.0);

    // Collision: marble ↔ marble
    resolveElasticCollision(marbleA, marbleB, 1.0, 1.0);

    // Goal detection
    if (isInGoal(ball, goalLeft)) {
      scoreB++;
      replayData.goals.push({
        frame: replayData.frames.length,
        team: marbleB.team.name,
        time: matchTimer
      });
      showGoalFlash();
      logEvent(`GOL! ${marbleB.team.name} segna! (${scoreA} - ${scoreB})`);
      resetPositions();
      goalCooldown = 60; // ~1 second pause
    } else if (isInGoal(ball, goalRight)) {
      scoreA++;
      replayData.goals.push({
        frame: replayData.frames.length,
        team: marbleA.team.name,
        time: matchTimer
      });
      showGoalFlash();
      logEvent(`GOL! ${marbleA.team.name} segna! (${scoreA} - ${scoreB})`);
      resetPositions();
      goalCooldown = 60;
    }

    // Draw
    drawField();
    marbleA.draw();
    marbleB.draw();
    ball.draw();

    updateScoreboard(timeLeft);
    recordFrame();

    // End of match
    if (timeLeft <= 0) {
      endMatch();
      return;
    }
  }

  animFrameId = requestAnimationFrame(gameLoop);
}

// ─── Start / End Match ──────────────────────────────────────────
function startMatch() {
  if (selA.value === selB.value) {
    logEvent("Seleziona due squadre diverse!");
    return;
  }

  // Cleanup any previous state
  cancelAnimationFrame(animFrameId);
  cancelAnimationFrame(replayAnimId);
  replayMode = false;
  replayPlaying = false;
  replayDiv.style.display = "none";

  const teamAData = teams[parseInt(selA.value)];
  const teamBData = teams[parseInt(selB.value)];

  marbleA = new Marble(teamAData, canvas.width * 0.25);
  marbleB = new Marble(teamBData, canvas.width * 0.75);
  ball = new Ball();

  scoreA = 0;
  scoreB = 0;
  matchTimer = 0;
  lastTimestamp = 0;
  goalCooldown = 0;

  replayData = {
    teams: { a: teamAData.name, b: teamBData.name },
    frames: [],
    goals: []
  };

  gameRunning = true;
  btnStart.disabled = true;
  btnDL.disabled = true;
  selA.disabled = true;
  selB.disabled = true;

  logEvent(`${teamAData.name} vs ${teamBData.name} — Calcio d'inizio!`);
  animFrameId = requestAnimationFrame(gameLoop);
}

function endMatch() {
  gameRunning = false;
  btnStart.disabled = false;
  btnDL.disabled = false;
  selA.disabled = false;
  selB.disabled = false;

  let result;
  if (scoreA > scoreB) result = `${marbleA.team.name} vince!`;
  else if (scoreB > scoreA) result = `${marbleB.team.name} vince!`;
  else result = "Pareggio!";

  logEvent(`Fine partita! ${marbleA.team.name} ${scoreA} - ${scoreB} ${marbleB.team.name}. ${result}`);

  // Show replay controls
  replayDiv.style.display = "flex";
  replaySlider.max = replayData.frames.length - 1;
  replaySlider.value = 0;
  replayIdx = 0;
}

btnStart.addEventListener("click", startMatch);

// ─── Replay System ──────────────────────────────────────────────
function drawReplayFrame(idx) {
  if (idx < 0 || idx >= replayData.frames.length) return;
  const f = replayData.frames[idx];

  // Temporarily set marble/ball positions for drawing
  marbleA.x = f.mA.x;
  marbleA.y = f.mA.y;
  marbleB.x = f.mB.x;
  marbleB.y = f.mB.y;
  ball.x = f.ball.x;
  ball.y = f.ball.y;

  drawField();
  marbleA.draw();
  marbleB.draw();
  ball.draw();

  scoreA = f.scoreA;
  scoreB = f.scoreB;
  updateScoreboard(Math.max(0, MATCH_DURATION - f.time));

  const mins = Math.floor(f.time / 60);
  const secs = Math.floor(f.time % 60);
  replayTimeEl.textContent = `${mins}:${secs.toString().padStart(2, "0")}`;
}

function replayLoop() {
  if (!replayPlaying) return;
  if (replayIdx >= replayData.frames.length) {
    replayPlaying = false;
    return;
  }
  drawReplayFrame(replayIdx);
  replaySlider.value = replayIdx;
  replayIdx++;
  replayAnimId = requestAnimationFrame(replayLoop);
}

btnReplayPlay.addEventListener("click", () => {
  if (replayData.frames.length === 0) return;
  replayPlaying = true;
  replayMode = true;
  if (replayIdx >= replayData.frames.length) replayIdx = 0;
  replayLoop();
});

btnReplayPause.addEventListener("click", () => {
  replayPlaying = false;
  cancelAnimationFrame(replayAnimId);
});

replaySlider.addEventListener("input", () => {
  replayPlaying = false;
  cancelAnimationFrame(replayAnimId);
  replayIdx = parseInt(replaySlider.value);
  drawReplayFrame(replayIdx);
});

// ─── JSON Export ────────────────────────────────────────────────
btnDL.addEventListener("click", () => {
  if (replayData.frames.length === 0) return;

  const exportData = {
    match: `${replayData.teams.a} vs ${replayData.teams.b}`,
    finalScore: { [replayData.teams.a]: scoreA, [replayData.teams.b]: scoreB },
    duration: MATCH_DURATION,
    goals: replayData.goals,
    frames: replayData.frames
  };

  const blob = new Blob([JSON.stringify(exportData)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `replay_${replayData.teams.a}_vs_${replayData.teams.b}_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

// ─── Initial Draw ───────────────────────────────────────────────
drawField();
updateScoreboard(MATCH_DURATION);
logEvent("Seleziona le squadre e premi 'Gioca partita'");
</script>

</body>
</html>
