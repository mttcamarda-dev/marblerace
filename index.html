<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Marble Race</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    select, button {
      font-size: 1rem;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    select {
      background: #16213e;
      color: #eee;
      border: 1px solid #0f3460;
    }

    button {
      background: #0f3460;
      color: #eee;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) { background: #e94560; }
    button:disabled { opacity: 0.4; cursor: default; }

    .vs { font-weight: 700; font-size: 1.1rem; }

    .scoreboard {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 1.4rem;
      font-weight: 700;
      min-height: 40px;
    }

    .scoreboard .team-score {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scoreboard .team-score .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-block;
    }

    .scoreboard .timer {
      font-size: 1.1rem;
      color: #aaa;
      min-width: 50px;
      text-align: center;
    }

    canvas {
      border: 3px solid #333;
      border-radius: 50%;
      background: #111;
      display: block;
      max-width: 100%;
    }

    .replay-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .replay-controls input[type="range"] {
      width: 300px;
      accent-color: #e94560;
    }

    .goal-flash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px rgba(255,255,255,0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
    }

    .goal-flash.visible { opacity: 1; }

    .match-log {
      margin-top: 12px;
      max-width: 520px;
      width: 100%;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>Football Marble Race</h1>

<div class="controls">
  <select id="teamA"></select>
  <span class="vs">VS</span>
  <select id="teamB"></select>
  <button id="start">Gioca partita</button>
  <button id="downloadReplay" disabled>Scarica Replay</button>
</div>

<div class="scoreboard" id="scoreboard"></div>

<canvas id="game" width="520" height="520"></canvas>

<div class="replay-controls" id="replayControls" style="display:none;">
  <button id="replayPlay">Riproduci</button>
  <button id="replayPause">Pausa</button>
  <input type="range" id="replaySlider" min="0" max="100" value="0" />
  <span id="replayTime">0:00</span>
</div>

<div class="goal-flash" id="goalFlash">GOL!</div>
<div class="match-log" id="matchLog"></div>

<script>
// ─── Configuration ──────────────────────────────────────────────
const MATCH_DURATION = 60;
const BALL_RADIUS = 12;
const MARBLE_RADIUS = 24;
const MARBLES_PER_TEAM = 1;
const FPS = 60;
const FRAME_MS = 1000 / FPS;

// Circular field
const FIELD_CX = 260;
const FIELD_CY = 260;
const FIELD_RADIUS = 220;

// Rotating goal: angular width in radians (~25°)
const GOAL_ARC = 0.44;
// One full rotation in ~10 seconds at 60 FPS
const GOAL_SPEED = (2 * Math.PI) / (10 * FPS);
const GOAL_NET_DEPTH = 22;

// ─── Teams ──────────────────────────────────────────────────────
const teams = [
  { name: "Milan",      color: "#AC1E2D", accent: "#000",    power: 1.00, logo: drawMilanLogo },
  { name: "Inter",      color: "#0055A4", accent: "#000",    power: 1.05, logo: drawInterLogo },
  { name: "Juventus",   color: "#000000", accent: "#fff",    power: 1.03, logo: drawJuventusLogo },
  { name: "Roma",       color: "#8E1F2F", accent: "#F0BC42", power: 0.98, logo: drawRomaLogo },
  { name: "Napoli",     color: "#1E90FF", accent: "#fff",    power: 1.04, logo: drawNapoliLogo },
  { name: "Lazio",      color: "#87CEEB", accent: "#fff",    power: 0.97, logo: drawLazioLogo },
  { name: "Fiorentina", color: "#6A0DAD", accent: "#fff",    power: 0.96, logo: drawFiorentinaLogo },
  { name: "Atalanta",   color: "#1C1C1C", accent: "#0074D9", power: 1.01, logo: drawAtalantaLogo },
  { name: "Torino",     color: "#8B0000", accent: "#fff",    power: 0.95, logo: drawTorinoLogo },
  { name: "Bologna",    color: "#A41E35", accent: "#1B3D6D", power: 0.94, logo: drawBolognaLogo },
];

// ─── Team Logo Drawing Functions ────────────────────────────────
// Each draws a simplified but recognizable crest at (0,0) inside radius r

function drawMilanLogo(ctx, r) {
  // Shield with red cross + red-black stripes
  const s = r * 0.65;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(s, -s * 0.3);
  ctx.lineTo(s, s * 0.5);
  ctx.quadraticCurveTo(0, s * 1.1, 0, s * 1.1);
  ctx.quadraticCurveTo(0, s * 1.1, -s, s * 0.5);
  ctx.lineTo(-s, -s * 0.3);
  ctx.closePath();
  ctx.clip();
  // Red-black stripes
  const sw = s * 0.5;
  for (let i = -2; i <= 2; i++) {
    ctx.fillStyle = i % 2 === 0 ? "#AC1E2D" : "#000";
    ctx.fillRect(i * sw - sw / 2, -r, sw, r * 2.5);
  }
  // White cross on top half
  ctx.fillStyle = "#fff";
  ctx.fillRect(-s * 0.08, -s * 0.8, s * 0.16, s * 0.9);
  ctx.fillRect(-s * 0.45, -s * 0.5, s * 0.9, s * 0.16);
  ctx.restore();
}

function drawInterLogo(ctx, r) {
  // Blue-black circle with gold "IM"
  const s = r * 0.7;
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI * 2);
  ctx.fillStyle = "#0055A4";
  ctx.fill();
  ctx.strokeStyle = "#C5A44E";
  ctx.lineWidth = s * 0.12;
  ctx.stroke();
  // Blue-black stripes clipped
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.85, 0, Math.PI * 2);
  ctx.clip();
  const sw = s * 0.38;
  for (let i = -2; i <= 2; i++) {
    ctx.fillStyle = i % 2 === 0 ? "#0055A4" : "#000";
    ctx.fillRect(i * sw - sw / 2, -r, sw, r * 2.5);
  }
  ctx.restore();
  // Gold "IM" letters
  ctx.font = `bold ${s * 0.7}px serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#C5A44E";
  ctx.fillText("IM", 0, s * 0.05);
}

function drawJuventusLogo(ctx, r) {
  // Black-white shield with stylized J
  const s = r * 0.65;
  // Shield shape
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(s * 0.8, -s * 0.3);
  ctx.lineTo(s * 0.8, s * 0.4);
  ctx.quadraticCurveTo(0, s * 1.15, 0, s * 1.15);
  ctx.quadraticCurveTo(0, s * 1.15, -s * 0.8, s * 0.4);
  ctx.lineTo(-s * 0.8, -s * 0.3);
  ctx.closePath();
  ctx.fillStyle = "#000";
  ctx.fill();
  // White left half
  ctx.save();
  ctx.beginPath();
  ctx.rect(-r, -r, r, r * 2);
  ctx.clip();
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(s * 0.8, -s * 0.3);
  ctx.lineTo(s * 0.8, s * 0.4);
  ctx.quadraticCurveTo(0, s * 1.15, 0, s * 1.15);
  ctx.quadraticCurveTo(0, s * 1.15, -s * 0.8, s * 0.4);
  ctx.lineTo(-s * 0.8, -s * 0.3);
  ctx.closePath();
  ctx.fillStyle = "#fff";
  ctx.fill();
  ctx.restore();
  // J letter
  ctx.font = `bold ${s * 1.1}px serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#000";
  ctx.fillText("J", s * 0.05, s * 0.15);
}

function drawRomaLogo(ctx, r) {
  // Maroon-gold circle with wolf silhouette
  const s = r * 0.7;
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI * 2);
  ctx.fillStyle = "#8E1F2F";
  ctx.fill();
  ctx.strokeStyle = "#F0BC42";
  ctx.lineWidth = s * 0.12;
  ctx.stroke();
  // Simplified wolf head
  ctx.fillStyle = "#F0BC42";
  ctx.beginPath();
  // Ears
  ctx.moveTo(-s * 0.35, -s * 0.15);
  ctx.lineTo(-s * 0.25, -s * 0.55);
  ctx.lineTo(-s * 0.05, -s * 0.2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.35, -s * 0.15);
  ctx.lineTo(s * 0.25, -s * 0.55);
  ctx.lineTo(s * 0.05, -s * 0.2);
  ctx.fill();
  // Head
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.3, s * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();
  // Snout
  ctx.beginPath();
  ctx.ellipse(0, s * 0.25, s * 0.15, s * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  // Eyes
  ctx.fillStyle = "#8E1F2F";
  ctx.beginPath();
  ctx.arc(-s * 0.12, -s * 0.05, s * 0.06, 0, Math.PI * 2);
  ctx.arc(s * 0.12, -s * 0.05, s * 0.06, 0, Math.PI * 2);
  ctx.fill();
}

function drawNapoliLogo(ctx, r) {
  // Blue circle with white ornate N
  const s = r * 0.7;
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI * 2);
  ctx.fillStyle = "#1E90FF";
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = s * 0.1;
  ctx.stroke();
  // Stylized N
  ctx.lineWidth = s * 0.15;
  ctx.strokeStyle = "#fff";
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-s * 0.3, s * 0.35);
  ctx.lineTo(-s * 0.3, -s * 0.35);
  ctx.lineTo(s * 0.3, s * 0.35);
  ctx.lineTo(s * 0.3, -s * 0.35);
  ctx.stroke();
  ctx.lineCap = "butt";
}

function drawLazioLogo(ctx, r) {
  // Light blue with white eagle
  const s = r * 0.7;
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI * 2);
  ctx.fillStyle = "#87CEEB";
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = s * 0.08;
  ctx.stroke();
  // Eagle body
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.15);
  ctx.lineTo(-s * 0.15, s * 0.3);
  ctx.lineTo(s * 0.15, s * 0.3);
  ctx.closePath();
  ctx.fill();
  // Eagle head
  ctx.beginPath();
  ctx.arc(0, -s * 0.25, s * 0.12, 0, Math.PI * 2);
  ctx.fill();
  // Beak
  ctx.beginPath();
  ctx.moveTo(s * 0.1, -s * 0.25);
  ctx.lineTo(s * 0.22, -s * 0.2);
  ctx.lineTo(s * 0.1, -s * 0.18);
  ctx.closePath();
  ctx.fillStyle = "#F0BC42";
  ctx.fill();
  // Wings spread
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.moveTo(-s * 0.1, -s * 0.05);
  ctx.quadraticCurveTo(-s * 0.55, -s * 0.5, -s * 0.6, -s * 0.15);
  ctx.quadraticCurveTo(-s * 0.45, s * 0.05, -s * 0.15, s * 0.15);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.1, -s * 0.05);
  ctx.quadraticCurveTo(s * 0.55, -s * 0.5, s * 0.6, -s * 0.15);
  ctx.quadraticCurveTo(s * 0.45, s * 0.05, s * 0.15, s * 0.15);
  ctx.closePath();
  ctx.fill();
}

function drawFiorentinaLogo(ctx, r) {
  // Purple background with red giglio (fleur-de-lis of Florence)
  const s = r * 0.7;
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI * 2);
  ctx.fillStyle = "#6A0DAD";
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = s * 0.08;
  ctx.stroke();
  // Giglio (fleur-de-lis)
  const g = s * 0.75;
  ctx.fillStyle = "#D2122E";
  // Center petal
  ctx.beginPath();
  ctx.moveTo(0, -g * 0.7);
  ctx.bezierCurveTo(-g * 0.2, -g * 0.5, -g * 0.15, -g * 0.1, -g * 0.05, g * 0.05);
  ctx.lineTo(g * 0.05, g * 0.05);
  ctx.bezierCurveTo(g * 0.15, -g * 0.1, g * 0.2, -g * 0.5, 0, -g * 0.7);
  ctx.fill();
  // Left petal
  ctx.beginPath();
  ctx.moveTo(-g * 0.08, -g * 0.15);
  ctx.bezierCurveTo(-g * 0.5, -g * 0.55, -g * 0.65, -g * 0.15, -g * 0.45, g * 0.1);
  ctx.bezierCurveTo(-g * 0.35, g * 0.15, -g * 0.15, g * 0.05, -g * 0.08, -g * 0.05);
  ctx.closePath();
  ctx.fill();
  // Right petal
  ctx.beginPath();
  ctx.moveTo(g * 0.08, -g * 0.15);
  ctx.bezierCurveTo(g * 0.5, -g * 0.55, g * 0.65, -g * 0.15, g * 0.45, g * 0.1);
  ctx.bezierCurveTo(g * 0.35, g * 0.15, g * 0.15, g * 0.05, g * 0.08, -g * 0.05);
  ctx.closePath();
  ctx.fill();
  // Stem
  ctx.fillRect(-g * 0.06, g * 0.05, g * 0.12, g * 0.35);
  // Base bar
  ctx.beginPath();
  ctx.moveTo(-g * 0.22, g * 0.35);
  ctx.lineTo(g * 0.22, g * 0.35);
  ctx.lineTo(g * 0.18, g * 0.48);
  ctx.lineTo(-g * 0.18, g * 0.48);
  ctx.closePath();
  ctx.fill();
  // Stamens (3 dots on top)
  ctx.beginPath();
  ctx.arc(0, -g * 0.72, g * 0.06, 0, Math.PI * 2);
  ctx.arc(-g * 0.25, -g * 0.35, g * 0.05, 0, Math.PI * 2);
  ctx.arc(g * 0.25, -g * 0.35, g * 0.05, 0, Math.PI * 2);
  ctx.fill();
}

function drawAtalantaLogo(ctx, r) {
  // Black-blue vertical halves with white goddess silhouette
  const s = r * 0.7;
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI * 2);
  ctx.clip();
  // Left half: black
  ctx.fillStyle = "#1C1C1C";
  ctx.fillRect(-r, -r, r, r * 2);
  // Right half: blue
  ctx.fillStyle = "#0074D9";
  ctx.fillRect(0, -r, r, r * 2);
  ctx.restore();
  // Border
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI * 2);
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = s * 0.08;
  ctx.stroke();
  // Goddess head silhouette
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(0, -s * 0.15, s * 0.2, 0, Math.PI * 2);
  ctx.fill();
  // Hair flowing left
  ctx.beginPath();
  ctx.moveTo(-s * 0.15, -s * 0.25);
  ctx.quadraticCurveTo(-s * 0.45, -s * 0.15, -s * 0.35, s * 0.15);
  ctx.quadraticCurveTo(-s * 0.2, s * 0.05, -s * 0.1, -s * 0.05);
  ctx.closePath();
  ctx.fill();
  // Neck + shoulders
  ctx.beginPath();
  ctx.moveTo(-s * 0.1, s * 0.02);
  ctx.lineTo(-s * 0.3, s * 0.35);
  ctx.lineTo(s * 0.3, s * 0.35);
  ctx.lineTo(s * 0.1, s * 0.02);
  ctx.closePath();
  ctx.fill();
}

function drawTorinoLogo(ctx, r) {
  // Maroon circle with golden bull (toro)
  const s = r * 0.7;
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI * 2);
  ctx.fillStyle = "#8B0000";
  ctx.fill();
  ctx.strokeStyle = "#C5A44E";
  ctx.lineWidth = s * 0.1;
  ctx.stroke();
  // Bull silhouette
  ctx.fillStyle = "#fff";
  // Body
  ctx.beginPath();
  ctx.ellipse(0, s * 0.15, s * 0.4, s * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  // Head
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.15, s * 0.2, s * 0.17, 0, 0, Math.PI * 2);
  ctx.fill();
  // Left horn (curved outward)
  ctx.beginPath();
  ctx.moveTo(-s * 0.15, -s * 0.28);
  ctx.quadraticCurveTo(-s * 0.45, -s * 0.6, -s * 0.3, -s * 0.65);
  ctx.quadraticCurveTo(-s * 0.2, -s * 0.55, -s * 0.12, -s * 0.35);
  ctx.closePath();
  ctx.fill();
  // Right horn
  ctx.beginPath();
  ctx.moveTo(s * 0.15, -s * 0.28);
  ctx.quadraticCurveTo(s * 0.45, -s * 0.6, s * 0.3, -s * 0.65);
  ctx.quadraticCurveTo(s * 0.2, -s * 0.55, s * 0.12, -s * 0.35);
  ctx.closePath();
  ctx.fill();
  // Legs (4 stubs)
  ctx.fillRect(-s * 0.3, s * 0.3, s * 0.1, s * 0.2);
  ctx.fillRect(-s * 0.1, s * 0.3, s * 0.1, s * 0.2);
  ctx.fillRect(s * 0.05, s * 0.3, s * 0.1, s * 0.2);
  ctx.fillRect(s * 0.22, s * 0.3, s * 0.1, s * 0.2);
  // Tail
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = s * 0.05;
  ctx.beginPath();
  ctx.moveTo(s * 0.38, s * 0.05);
  ctx.quadraticCurveTo(s * 0.55, -s * 0.15, s * 0.45, -s * 0.3);
  ctx.stroke();
  // Eyes (dark)
  ctx.fillStyle = "#8B0000";
  ctx.beginPath();
  ctx.arc(-s * 0.08, -s * 0.18, s * 0.04, 0, Math.PI * 2);
  ctx.arc(s * 0.08, -s * 0.18, s * 0.04, 0, Math.PI * 2);
  ctx.fill();
  // Nostrils
  ctx.beginPath();
  ctx.arc(-s * 0.06, -s * 0.06, s * 0.025, 0, Math.PI * 2);
  ctx.arc(s * 0.06, -s * 0.06, s * 0.025, 0, Math.PI * 2);
  ctx.fill();
}

function drawBolognaLogo(ctx, r) {
  // Red-blue halved shield with white BFC
  const s = r * 0.65;
  // Shield
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(s, -s * 0.3);
  ctx.lineTo(s, s * 0.5);
  ctx.quadraticCurveTo(0, s * 1.1, 0, s * 1.1);
  ctx.quadraticCurveTo(0, s * 1.1, -s, s * 0.5);
  ctx.lineTo(-s, -s * 0.3);
  ctx.closePath();
  ctx.clip();
  // Left half red
  ctx.fillStyle = "#A41E35";
  ctx.fillRect(-r, -r, r, r * 2.5);
  // Right half blue
  ctx.fillStyle = "#1B3D6D";
  ctx.fillRect(0, -r, r, r * 2.5);
  ctx.restore();
  // Shield border
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(s, -s * 0.3);
  ctx.lineTo(s, s * 0.5);
  ctx.quadraticCurveTo(0, s * 1.1, 0, s * 1.1);
  ctx.quadraticCurveTo(0, s * 1.1, -s, s * 0.5);
  ctx.lineTo(-s, -s * 0.3);
  ctx.closePath();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = s * 0.08;
  ctx.stroke();
  // BFC text
  ctx.font = `bold ${s * 0.45}px sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff";
  ctx.fillText("BFC", 0, s * 0.1);
}

// ─── DOM ────────────────────────────────────────────────────────
const canvas   = document.getElementById("game");
const ctx      = canvas.getContext("2d");
const selA     = document.getElementById("teamA");
const selB     = document.getElementById("teamB");
const btnStart = document.getElementById("start");
const btnDL    = document.getElementById("downloadReplay");
const scoreboard   = document.getElementById("scoreboard");
const goalFlashEl  = document.getElementById("goalFlash");
const matchLogEl   = document.getElementById("matchLog");
const replayDiv    = document.getElementById("replayControls");
const replaySlider = document.getElementById("replaySlider");
const replayTimeEl = document.getElementById("replayTime");
const btnReplayPlay  = document.getElementById("replayPlay");
const btnReplayPause = document.getElementById("replayPause");

// Populate selectors
teams.forEach((t, i) => {
  selA.appendChild(new Option(t.name, i));
  selB.appendChild(new Option(t.name, i));
});
selB.value = 1;

// ─── Game State ─────────────────────────────────────────────────
let gameRunning = false;
let animFrameId = null;
let matchTimer  = 0;
let lastTimestamp = 0;
let scoreA = 0;
let scoreB = 0;
let goalAngle = 0;       // current rotation angle of the goal
let marblesA = [];        // team A marbles
let marblesB = [];        // team B marbles
let allMarbles = [];
let ball = null;
let goalCooldown = 0;
let teamAData = null;
let teamBData = null;

// ─── Replay Data ────────────────────────────────────────────────
let replayData = { teams: {}, frames: [], goals: [] };
let replayIdx  = 0;
let replayPlaying = false;
let replayAnimId  = null;

// ─── Angle Helpers ──────────────────────────────────────────────
function normalizeAngle(a) {
  a = a % (2 * Math.PI);
  if (a < 0) a += 2 * Math.PI;
  return a;
}

function angleDiff(a, b) {
  let d = normalizeAngle(a) - normalizeAngle(b);
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

function isAngleInGoal(angle) {
  return Math.abs(angleDiff(angle, goalAngle)) < GOAL_ARC / 2;
}

// ─── Ball ───────────────────────────────────────────────────────
class Ball {
  constructor() {
    this.radius = BALL_RADIUS;
    this.reset();
  }

  reset() {
    this.x = FIELD_CX;
    this.y = FIELD_CY;
    this.vx = 0;
    this.vy = 0;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.995;
    this.vy *= 0.995;
    constrainToField(this);
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x + 2, this.y + 2, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.strokeStyle = "#999";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Pentagon pattern
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 2 * Math.PI) / 5 - Math.PI / 2;
      const px = this.x + Math.cos(a) * (this.radius * 0.5);
      const py = this.y + Math.sin(a) * (this.radius * 0.5);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.fill();
  }
}

// ─── Marble ─────────────────────────────────────────────────────
class Marble {
  constructor(team, startX, startY, id) {
    this.team = team;
    this.id = id;
    this.radius = MARBLE_RADIUS;
    this.startX = startX;
    this.startY = startY;
    this.x = startX;
    this.y = startY;
    this.vx = 0;
    this.vy = 0;
    this.targetX = startX;
    this.targetY = startY;
    this.thinkTimer = 0;
  }

  respawn() {
    this.x = this.startX;
    this.y = this.startY;
    this.vx = 0;
    this.vy = 0;
    this.thinkTimer = 0;
  }

  think() {
    this.thinkTimer--;
    if (this.thinkTimer > 0) return;
    this.thinkTimer = Math.floor(8 + Math.random() * 18);

    // Predict where the goal will be in ~0.5s
    const prediction = 25 + Math.random() * 20;
    const futureAngle = goalAngle + GOAL_SPEED * prediction;

    // Target a point just inside the perimeter at the goal's future position
    const targetDist = FIELD_RADIUS - this.radius * 0.5;
    this.targetX = FIELD_CX + Math.cos(futureAngle) * targetDist;
    this.targetY = FIELD_CY + Math.sin(futureAngle) * targetDist;

    // Add some noise scaled by inverse power (weaker teams = more noise)
    const noise = (1.1 - this.team.power) * 60;
    this.targetX += (Math.random() - 0.5) * noise;
    this.targetY += (Math.random() - 0.5) * noise;
  }

  update() {
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 1) {
      const accel = 0.35 * this.team.power;
      this.vx += (dx / dist) * accel;
      this.vy += (dy / dist) * accel;
    }

    const maxSpeed = 4.5 * this.team.power;
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > maxSpeed) {
      this.vx = (this.vx / speed) * maxSpeed;
      this.vy = (this.vy / speed) * maxSpeed;
    }

    this.vx *= 0.97;
    this.vy *= 0.97;

    this.x += this.vx;
    this.y += this.vy;
  }

  draw() {
    const r = this.radius;

    // Shadow
    ctx.beginPath();
    ctx.arc(this.x + 2, this.y + 2, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fill();

    // 3D gradient body
    const grad = ctx.createRadialGradient(
      this.x - r * 0.3, this.y - r * 0.3, r * 0.1,
      this.x, this.y, r
    );
    grad.addColorStop(0, lightenColor(this.team.color, 50));
    grad.addColorStop(1, this.team.color);

    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Team logo
    ctx.save();
    ctx.translate(this.x, this.y);
    this.team.logo(ctx, r);
    ctx.restore();

    // Shine highlight
    ctx.beginPath();
    ctx.arc(this.x - r * 0.28, this.y - r * 0.28, r * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fill();
  }
}

// ─── Color Helper ───────────────────────────────────────────────
function lightenColor(hex, amount) {
  const num = parseInt(hex.replace("#", ""), 16);
  const r = Math.min(255, (num >> 16) + amount);
  const g = Math.min(255, ((num >> 8) & 0xFF) + amount);
  const b = Math.min(255, (num & 0xFF) + amount);
  return `rgb(${r},${g},${b})`;
}

// ─── Circular Field Constraint ──────────────────────────────────
function constrainToField(obj) {
  const dx = obj.x - FIELD_CX;
  const dy = obj.y - FIELD_CY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const maxDist = FIELD_RADIUS - obj.radius;

  if (dist > maxDist) {
    // Push back inside
    const nx = dx / dist;
    const ny = dy / dist;
    obj.x = FIELD_CX + nx * maxDist;
    obj.y = FIELD_CY + ny * maxDist;

    // Reflect velocity off the circular wall
    const dot = obj.vx * nx + obj.vy * ny;
    obj.vx -= 2 * dot * nx;
    obj.vy -= 2 * dot * ny;
    obj.vx *= 0.7;
    obj.vy *= 0.7;
  }
}

// Returns the scoring marble if one exits through the goal, otherwise null
function constrainMarbleOrScore(marble) {
  const dx = marble.x - FIELD_CX;
  const dy = marble.y - FIELD_CY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const maxDist = FIELD_RADIUS - marble.radius;

  if (dist > maxDist) {
    const angle = Math.atan2(dy, dx);

    // Check if the marble is exiting through the goal opening
    if (isAngleInGoal(angle)) {
      return marble; // SCORED
    }

    // Otherwise bounce off the wall
    const nx = dx / dist;
    const ny = dy / dist;
    marble.x = FIELD_CX + nx * maxDist;
    marble.y = FIELD_CY + ny * maxDist;

    const dot = marble.vx * nx + marble.vy * ny;
    marble.vx -= 2 * dot * nx;
    marble.vy -= 2 * dot * ny;
    marble.vx *= 0.7;
    marble.vy *= 0.7;
  }
  return null;
}

// ─── Circle Collision ───────────────────────────────────────────
function circleCollision(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const minDist = a.radius + b.radius;
  return dist < minDist ? { dx, dy, dist, minDist } : null;
}

function resolveElasticCollision(a, b, massA, massB) {
  const col = circleCollision(a, b);
  if (!col) return;

  const { dx, dy, dist, minDist } = col;
  if (dist === 0) return;

  const nx = dx / dist;
  const ny = dy / dist;

  const overlap = (minDist - dist) / 2;
  a.x -= nx * overlap;
  a.y -= ny * overlap;
  b.x += nx * overlap;
  b.y += ny * overlap;

  const dvx = a.vx - b.vx;
  const dvy = a.vy - b.vy;
  const relNormal = dvx * nx + dvy * ny;
  if (relNormal < 0) return;

  const restitution = 0.85;
  const impulse = (2 * relNormal) / (massA + massB) * restitution;

  a.vx -= impulse * massB * nx;
  a.vy -= impulse * massB * ny;
  b.vx += impulse * massA * nx;
  b.vy += impulse * massA * ny;
}

// ─── Drawing ────────────────────────────────────────────────────
function drawField() {
  // Dark background
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Field grass — radial gradient
  const grassGrad = ctx.createRadialGradient(
    FIELD_CX, FIELD_CY, 0,
    FIELD_CX, FIELD_CY, FIELD_RADIUS
  );
  grassGrad.addColorStop(0, "#0d7a2b");
  grassGrad.addColorStop(1, "#085a1e");

  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = grassGrad;
  ctx.fill();

  // Field boundary ring (draw the wall part, skip the goal gap)
  const gStart = normalizeAngle(goalAngle - GOAL_ARC / 2);
  const gEnd   = normalizeAngle(goalAngle + GOAL_ARC / 2);

  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, gEnd, gStart);
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 4;
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, 36, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(255,255,255,0.15)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Center dot
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, 4, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.fill();

  drawGoalGate();
}

function drawGoalGate() {
  const gStart = goalAngle - GOAL_ARC / 2;
  const gEnd   = goalAngle + GOAL_ARC / 2;

  // Net area (arc extending outward)
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, gStart, gEnd);
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS + GOAL_NET_DEPTH, gEnd, gStart, true);
  ctx.closePath();
  ctx.fillStyle = "rgba(255,215,0,0.12)";
  ctx.fill();

  // Net lines
  ctx.strokeStyle = "rgba(255,255,255,0.2)";
  ctx.lineWidth = 1;
  const steps = 6;
  for (let i = 0; i <= steps; i++) {
    const a = gStart + (gEnd - gStart) * (i / steps);
    const ix = FIELD_CX + Math.cos(a) * FIELD_RADIUS;
    const iy = FIELD_CY + Math.sin(a) * FIELD_RADIUS;
    const ox = FIELD_CX + Math.cos(a) * (FIELD_RADIUS + GOAL_NET_DEPTH);
    const oy = FIELD_CY + Math.sin(a) * (FIELD_RADIUS + GOAL_NET_DEPTH);
    ctx.beginPath();
    ctx.moveTo(ix, iy);
    ctx.lineTo(ox, oy);
    ctx.stroke();
  }
  // Cross lines in net
  for (let j = 1; j <= 2; j++) {
    const r = FIELD_RADIUS + GOAL_NET_DEPTH * (j / 3);
    ctx.beginPath();
    ctx.arc(FIELD_CX, FIELD_CY, r, gStart, gEnd);
    ctx.stroke();
  }

  // Goal opening highlight arc
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, gStart, gEnd);
  ctx.strokeStyle = "#FFD700";
  ctx.lineWidth = 4;
  ctx.stroke();

  // Outer net arc
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS + GOAL_NET_DEPTH, gStart, gEnd);
  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Goal posts
  const p1x = FIELD_CX + Math.cos(gStart) * FIELD_RADIUS;
  const p1y = FIELD_CY + Math.sin(gStart) * FIELD_RADIUS;
  const p2x = FIELD_CX + Math.cos(gEnd)   * FIELD_RADIUS;
  const p2y = FIELD_CY + Math.sin(gEnd)   * FIELD_RADIUS;

  [{ x: p1x, y: p1y }, { x: p2x, y: p2y }].forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#FFD700";
    ctx.fill();
    ctx.strokeStyle = "#B8860B";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });
}

// ─── Scoreboard & UI ────────────────────────────────────────────
function updateScoreboard(timeLeft) {
  if (!teamAData || !teamBData) { scoreboard.innerHTML = ""; return; }
  const mins = Math.floor(timeLeft / 60);
  const secs = Math.floor(timeLeft % 60);
  const timeStr = `${mins}:${secs.toString().padStart(2, "0")}`;

  scoreboard.innerHTML = `
    <span class="team-score">
      <span class="dot" style="background:${teamAData.color}"></span>
      ${teamAData.name} ${scoreA}
    </span>
    <span class="timer">${timeStr}</span>
    <span class="team-score">
      ${scoreB} ${teamBData.name}
      <span class="dot" style="background:${teamBData.color}"></span>
    </span>
  `;
}

function showGoalFlash() {
  goalFlashEl.classList.add("visible");
  setTimeout(() => goalFlashEl.classList.remove("visible"), 1200);
}

function logEvent(msg) {
  matchLogEl.textContent = msg;
}

// ─── Marble Creation ────────────────────────────────────────────
function createTeamMarbles(team, side) {
  const marbles = [];
  const angle = side === "left" ? Math.PI : 0;
  const dist = FIELD_RADIUS * 0.4;
  const x = FIELD_CX + Math.cos(angle) * dist;
  const y = FIELD_CY + Math.sin(angle) * dist;
  marbles.push(new Marble(team, x, y, team.name));
  return marbles;
}

// ─── Record Frame ───────────────────────────────────────────────
function recordFrame() {
  replayData.frames.push({
    marbles: allMarbles.map(m => ({ x: m.x, y: m.y, team: m.team.name })),
    ball: { x: ball.x, y: ball.y },
    goalAngle,
    scoreA,
    scoreB,
    time: matchTimer
  });
}

// ─── Game Loop ──────────────────────────────────────────────────
function gameLoop(timestamp) {
  if (!gameRunning) return;

  if (!lastTimestamp) lastTimestamp = timestamp;
  const delta = timestamp - lastTimestamp;

  if (delta >= FRAME_MS) {
    lastTimestamp = timestamp;
    matchTimer += delta / 1000;
    const timeLeft = Math.max(0, MATCH_DURATION - matchTimer);

    // Rotate goal
    goalAngle += GOAL_SPEED;

    // Goal cooldown
    if (goalCooldown > 0) {
      goalCooldown--;
      drawField();
      allMarbles.forEach(m => m.draw());
      ball.draw();
      updateScoreboard(timeLeft);
      recordFrame();
      animFrameId = requestAnimationFrame(gameLoop);
      return;
    }

    // AI + Update
    allMarbles.forEach(m => {
      m.think();
      m.update();
    });
    ball.update();

    // Marble ↔ ball collisions
    allMarbles.forEach(m => resolveElasticCollision(m, ball, 2.0, 1.0));

    // Marble ↔ marble collisions
    for (let i = 0; i < allMarbles.length; i++) {
      for (let j = i + 1; j < allMarbles.length; j++) {
        resolveElasticCollision(allMarbles[i], allMarbles[j], 1.0, 1.0);
      }
    }

    // Check scoring: marble exits through goal gap
    let scored = null;
    for (const m of allMarbles) {
      const result = constrainMarbleOrScore(m);
      if (result && !scored) {
        scored = result;
      }
    }

    if (scored) {
      const isTeamA = marblesA.includes(scored);
      if (isTeamA) scoreA++;
      else scoreB++;

      replayData.goals.push({
        frame: replayData.frames.length,
        team: scored.team.name,
        time: matchTimer
      });

      showGoalFlash();
      logEvent(`GOL! ${scored.team.name} segna! (${scoreA} - ${scoreB})`);

      // Respawn the scoring marble + ball
      scored.respawn();
      ball.reset();
      goalCooldown = 45;
    }

    // Draw
    drawField();
    ball.draw();
    allMarbles.forEach(m => m.draw());

    updateScoreboard(timeLeft);
    recordFrame();

    if (timeLeft <= 0) {
      endMatch();
      return;
    }
  }

  animFrameId = requestAnimationFrame(gameLoop);
}

// ─── Start / End Match ──────────────────────────────────────────
function startMatch() {
  if (selA.value === selB.value) {
    logEvent("Seleziona due squadre diverse!");
    return;
  }

  cancelAnimationFrame(animFrameId);
  cancelAnimationFrame(replayAnimId);
  replayPlaying = false;
  replayDiv.style.display = "none";

  teamAData = teams[parseInt(selA.value)];
  teamBData = teams[parseInt(selB.value)];

  marblesA = createTeamMarbles(teamAData, "left");
  marblesB = createTeamMarbles(teamBData, "right");
  allMarbles = [...marblesA, ...marblesB];
  ball = new Ball();

  scoreA = 0;
  scoreB = 0;
  matchTimer = 0;
  lastTimestamp = 0;
  goalAngle = 0;
  goalCooldown = 0;

  replayData = {
    teams: { a: teamAData.name, b: teamBData.name },
    frames: [],
    goals: []
  };

  gameRunning = true;
  btnStart.disabled = true;
  btnDL.disabled = true;
  selA.disabled = true;
  selB.disabled = true;

  logEvent(`${teamAData.name} vs ${teamBData.name} — Via!`);
  animFrameId = requestAnimationFrame(gameLoop);
}

function endMatch() {
  gameRunning = false;
  btnStart.disabled = false;
  btnDL.disabled = false;
  selA.disabled = false;
  selB.disabled = false;

  let result;
  if (scoreA > scoreB) result = `${teamAData.name} vince!`;
  else if (scoreB > scoreA) result = `${teamBData.name} vince!`;
  else result = "Pareggio!";

  logEvent(`Fine partita! ${teamAData.name} ${scoreA} - ${scoreB} ${teamBData.name}. ${result}`);

  replayDiv.style.display = "flex";
  replaySlider.max = replayData.frames.length - 1;
  replaySlider.value = 0;
  replayIdx = 0;
}

btnStart.addEventListener("click", startMatch);

// ─── Replay System ──────────────────────────────────────────────
function drawReplayFrame(idx) {
  if (idx < 0 || idx >= replayData.frames.length) return;
  const f = replayData.frames[idx];

  goalAngle = f.goalAngle;

  f.marbles.forEach((md, i) => {
    if (i < allMarbles.length) {
      allMarbles[i].x = md.x;
      allMarbles[i].y = md.y;
    }
  });
  ball.x = f.ball.x;
  ball.y = f.ball.y;

  drawField();
  ball.draw();
  allMarbles.forEach(m => m.draw());

  scoreA = f.scoreA;
  scoreB = f.scoreB;
  updateScoreboard(Math.max(0, MATCH_DURATION - f.time));

  const mins = Math.floor(f.time / 60);
  const secs = Math.floor(f.time % 60);
  replayTimeEl.textContent = `${mins}:${secs.toString().padStart(2, "0")}`;
}

function replayLoop() {
  if (!replayPlaying) return;
  if (replayIdx >= replayData.frames.length) {
    replayPlaying = false;
    return;
  }
  drawReplayFrame(replayIdx);
  replaySlider.value = replayIdx;
  replayIdx++;
  replayAnimId = requestAnimationFrame(replayLoop);
}

btnReplayPlay.addEventListener("click", () => {
  if (replayData.frames.length === 0) return;
  replayPlaying = true;
  if (replayIdx >= replayData.frames.length) replayIdx = 0;
  replayLoop();
});

btnReplayPause.addEventListener("click", () => {
  replayPlaying = false;
  cancelAnimationFrame(replayAnimId);
});

replaySlider.addEventListener("input", () => {
  replayPlaying = false;
  cancelAnimationFrame(replayAnimId);
  replayIdx = parseInt(replaySlider.value);
  drawReplayFrame(replayIdx);
});

// ─── JSON Export ────────────────────────────────────────────────
btnDL.addEventListener("click", () => {
  if (replayData.frames.length === 0) return;

  const exportData = {
    match: `${replayData.teams.a} vs ${replayData.teams.b}`,
    finalScore: { [replayData.teams.a]: scoreA, [replayData.teams.b]: scoreB },
    duration: MATCH_DURATION,
    goals: replayData.goals,
    frames: replayData.frames
  };

  const blob = new Blob([JSON.stringify(exportData)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `replay_${replayData.teams.a}_vs_${replayData.teams.b}_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

// ─── Initial Draw ───────────────────────────────────────────────
drawField();
updateScoreboard(MATCH_DURATION);
logEvent("Seleziona le squadre e premi 'Gioca partita'");
</script>
