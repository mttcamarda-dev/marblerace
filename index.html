<html lang="it">

  <title>Football Marble Race</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    select, button {
      font-size: 1rem;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    select {
      background: #16213e;
      color: #eee;
      border: 1px solid #0f3460;
    }

    optgroup {
      background: #16213e;
      color: #aaa;
      font-style: normal;
      font-weight: 700;
      padding: 4px 0;
    }

    optgroup option {
      color: #eee;
      font-weight: 400;
      padding-left: 8px;
    }

    button {
      background: #0f3460;
      color: #eee;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) { background: #e94560; }
    button:disabled { opacity: 0.4; cursor: default; }

    .vs { font-weight: 700; font-size: 1.1rem; }

    .scoreboard {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 1.4rem;
      font-weight: 700;
      min-height: 40px;
    }

    .scoreboard .team-score {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scoreboard .team-score .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-block;
    }

    .scoreboard .timer {
      font-size: 1.1rem;
      color: #aaa;
      min-width: 50px;
      text-align: center;
    }

    canvas {
      border: 3px solid #333;
      border-radius: 12px;
      background: #111;
      display: block;
      max-width: 100%;
    }

    .replay-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .replay-controls input[type="range"] {
      width: 300px;
      accent-color: #e94560;
    }

    .goal-flash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px rgba(255,255,255,0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
    }

    .goal-flash.visible { opacity: 1; }

    .match-log {
      margin-top: 12px;
      max-width: 520px;
      width: 100%;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>Football Marble Race</h1>

<div class="controls">
  <select id="teamA"></select>
  <span class="vs">VS</span>
  <select id="teamB"></select>
  <select id="timeOfDay">
    <option value="day">Giorno</option>
    <option value="sunset">Tramonto</option>
    <option value="night" selected>Sera</option>
  </select>
  <button id="start">Gioca partita</button>
  <button id="downloadReplay" disabled>Scarica Replay</button>
</div>

<div class="scoreboard" id="scoreboard"></div>

<canvas id="game" width="520" height="560"></canvas>

<div class="replay-controls" id="replayControls" style="display:none;">
  <button id="replayPlay">Riproduci</button>
  <button id="replayPause">Pausa</button>
  <input type="range" id="replaySlider" min="0" max="100" value="0" />
  <span id="replayTime">0:00</span>
</div>

<div class="goal-flash" id="goalFlash">GOL!</div>
<div class="match-log" id="matchLog"></div>

// ─── Angle Helpers ──────────────────────────────────────────────
function normalizeAngle(a) {
  a = a % (2 * Math.PI);
  if (a < 0) a += 2 * Math.PI;
  return a;
}

function angleDiff(a, b) {
  let d = normalizeAngle(a) - normalizeAngle(b);
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

function isAngleInGoal(angle) {
  return Math.abs(angleDiff(angle, goalAngle)) < GOAL_ARC / 2;
}

// ─── Marble ─────────────────────────────────────────────────────
class Marble {
  constructor(team, startX, startY) {
    this.team = team;
    this.radius = MARBLE_RADIUS;
    this.startX = startX;
    this.startY = startY;
    this.x = startX;
    this.y = startY;
    // Launch with strong random velocity
    const a = Math.random() * Math.PI * 2;
    const spd = 7 + Math.random() * 3;
    this.vx = Math.cos(a) * spd;
    this.vy = Math.sin(a) * spd;
    this.targetX = startX;
    this.targetY = startY;
    this.thinkTimer = 0;
  }

  respawn() {
    this.x = this.startX;
    this.y = this.startY;
    const a = Math.random() * Math.PI * 2;
    const spd = 7 + Math.random() * 3;
    this.vx = Math.cos(a) * spd;
    this.vy = Math.sin(a) * spd;
    this.thinkTimer = 0;
  }

  think() {
    this.thinkTimer--;
    if (this.thinkTimer > 0) return;
    this.thinkTimer = Math.floor(40 + Math.random() * 60);

    // Completely random target — no goal seeking at all
    const randAngle = Math.random() * Math.PI * 2;
    const randDist = Math.random() * FIELD_RADIUS * 0.85;
    this.targetX = FIELD_CX + Math.cos(randAngle) * randDist;
    this.targetY = FIELD_CY + Math.sin(randAngle) * randDist;
  }

  update() {
    // Tiny nudge toward target — marbles coast on momentum
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 1) {
      const accel = 0.08 * this.team.power;
      this.vx += (dx / dist) * accel;
      this.vy += (dy / dist) * accel;
    }

    // Speed cap (high — springs launch fast)
    const maxSpeed = 11 * this.team.power;
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > maxSpeed) {
      this.vx = (this.vx / speed) * maxSpeed;
      this.vy = (this.vy / speed) * maxSpeed;
    }

    // No gravity, near-zero friction — marbles keep full momentum
    this.vx *= 0.999;
    this.vy *= 0.999;

    this.x += this.vx;
    this.y += this.vy;
  }

  draw() {
    const r = this.radius;

    // Shadow
    ctx.beginPath();
    ctx.arc(this.x + 2, this.y + 2, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fill();

    // 3D gradient body
    const grad = ctx.createRadialGradient(
      this.x - r * 0.3, this.y - r * 0.3, r * 0.1,
      this.x, this.y, r
    );
    grad.addColorStop(0, lightenColor(this.team.color, 60));
    grad.addColorStop(1, this.team.color);

    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Official logo image (or fallback initial)
    if (this.team.logoLoaded) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, r * 0.72, 0, Math.PI * 2);
      ctx.clip();
      const imgSize = r * 1.44;
      ctx.drawImage(this.team.logoImg, this.x - imgSize / 2, this.y - imgSize / 2, imgSize, imgSize);
      ctx.restore();
    } else {
      // Fallback: team initial
      ctx.fillStyle = this.team.accent;
      ctx.font = `bold ${r * 0.9}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(this.team.name[0], this.x, this.y);
    }

    // Shine highlight
    ctx.beginPath();
    ctx.arc(this.x - r * 0.28, this.y - r * 0.28, r * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.fill();
  }
}

// ─── Color Helper ───────────────────────────────────────────────
function lightenColor(hex, amount) {
  const num = parseInt(hex.replace("#", ""), 16);
  const r = Math.min(255, (num >> 16) + amount);
  const g = Math.min(255, ((num >> 8) & 0xFF) + amount);
  const b = Math.min(255, (num & 0xFF) + amount);
  return `rgb(${r},${g},${b})`;
}

// ─── Circular Field Constraint (spring walls) ───────────────────
const SPRING_BOOST = 1.2;         // walls ADD 20% energy on bounce
const MIN_BOUNCE_SPEED = 6;       // minimum speed after wall hit

function constrainMarbleOrScore(marble, canScore) {
  const dx = marble.x - FIELD_CX;
  const dy = marble.y - FIELD_CY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const maxDist = FIELD_RADIUS - marble.radius;

  if (dist > maxDist) {
    const angle = Math.atan2(dy, dx);

    // Score if exiting through the goal gap and team hasn't reached max
    if (canScore && isAngleInGoal(angle)) {
      return marble;
    }

    // Push marble back onto the wall edge
    const nx = dx / dist;
    const ny = dy / dist;
    marble.x = FIELD_CX + nx * maxDist;
    marble.y = FIELD_CY + ny * maxDist;

    // Reflect velocity off wall normal
    const dot = marble.vx * nx + marble.vy * ny;
    marble.vx -= 2 * dot * nx;
    marble.vy -= 2 * dot * ny;

    // SPRING effect: boost speed on every bounce (walls add energy)
    marble.vx *= SPRING_BOOST;
    marble.vy *= SPRING_BOOST;

    // Guarantee a minimum launch speed so marbles always fly across
    const speed = Math.sqrt(marble.vx * marble.vx + marble.vy * marble.vy);
    if (speed < MIN_BOUNCE_SPEED) {
      const scale = MIN_BOUNCE_SPEED / (speed || 1);
      marble.vx *= scale;
      marble.vy *= scale;
    }
  }
  return null;
}

// ─── Circle Collision ───────────────────────────────────────────
function resolveElasticCollision(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const minDist = a.radius + b.radius;
  if (dist >= minDist || dist === 0) return;

  const nx = dx / dist;
  const ny = dy / dist;

  const overlap = (minDist - dist) / 2;
  a.x -= nx * overlap;
  a.y -= ny * overlap;
  b.x += nx * overlap;
  b.y += ny * overlap;

  const dvx = a.vx - b.vx;
  const dvy = a.vy - b.vy;
  const relNormal = dvx * nx + dvy * ny;
  if (relNormal < 0) return;

  // Super-elastic collision (spring-like, adds energy)
  const bounce = 1.2;
  a.vx -= bounce * relNormal * nx;
  a.vy -= bounce * relNormal * ny;
  b.vx += bounce * relNormal * nx;
  b.vy += bounce * relNormal * ny;
}

// ─── Drawing ────────────────────────────────────────────────────
function drawField() {
  const T = THEMES[timeOfDay] || THEMES.night;

  // Background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bgGrad.addColorStop(0, T.bg1);
  bgGrad.addColorStop(1, T.bg2);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Sunset sky bands
  if (timeOfDay === "sunset") {
    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.5);
    skyGrad.addColorStop(0, "rgba(255,107,53,0.15)");
    skyGrad.addColorStop(0.4, "rgba(255,165,0,0.1)");
    skyGrad.addColorStop(0.7, "rgba(200,50,80,0.08)");
    skyGrad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height * 0.5);
  }

  // Stars (night only)
  if (timeOfDay === "night") {
    _stars.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.fill();
    });
  }

  // Title text
  ctx.save();
  ctx.font = "bold 22px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = T.titleGlow;
  ctx.shadowBlur = 18;
  ctx.fillStyle = T.titleColor;
  ctx.fillText("kingofmarble10", FIELD_CX, TITLE_HEIGHT / 2 + 2);
  ctx.shadowBlur = 6;
  ctx.fillText("kingofmarble10", FIELD_CX, TITLE_HEIGHT / 2 + 2);
  ctx.restore();

  // Outer glow around the field
  const glowGrad = ctx.createRadialGradient(
    FIELD_CX, FIELD_CY, FIELD_RADIUS - 10,
    FIELD_CX, FIELD_CY, FIELD_RADIUS + 30
  );
  glowGrad.addColorStop(0, T.glow);
  glowGrad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS + 30, 0, Math.PI * 2);
  ctx.fillStyle = glowGrad;
  ctx.fill();

  // Field grass
  const grassGrad = ctx.createRadialGradient(
    FIELD_CX - 30, FIELD_CY - 30, 20,
    FIELD_CX, FIELD_CY, FIELD_RADIUS
  );
  grassGrad.addColorStop(0, T.grass[0]);
  grassGrad.addColorStop(0.4, T.grass[1]);
  grassGrad.addColorStop(0.8, T.grass[2]);
  grassGrad.addColorStop(1, T.grass[3]);
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = grassGrad;
  ctx.fill();

  // Mowing stripes (vertical for day, diagonal for sunset/night)
  ctx.save();
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS - 1, 0, Math.PI * 2);
  ctx.clip();
  const stripeW = timeOfDay === "day" ? 30 : 28;
  ctx.fillStyle = `rgba(255,255,255,${T.stripeAlpha})`;
  if (timeOfDay === "day") {
    for (let x = FIELD_CX - FIELD_RADIUS; x < FIELD_CX + FIELD_RADIUS; x += stripeW * 2) {
      ctx.fillRect(x, FIELD_CY - FIELD_RADIUS, stripeW, FIELD_RADIUS * 2);
    }
  } else {
    for (let i = -FIELD_RADIUS * 3; i < FIELD_RADIUS * 3; i += stripeW * 2) {
      ctx.beginPath();
      ctx.moveTo(FIELD_CX + i, FIELD_CY - FIELD_RADIUS);
      ctx.lineTo(FIELD_CX + i + FIELD_RADIUS, FIELD_CY + FIELD_RADIUS);
      ctx.lineTo(FIELD_CX + i + FIELD_RADIUS + stripeW, FIELD_CY + FIELD_RADIUS);
      ctx.lineTo(FIELD_CX + i + stripeW, FIELD_CY - FIELD_RADIUS);
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.restore();

  // Inner edge shadow
  const edgeShadow = ctx.createRadialGradient(
    FIELD_CX, FIELD_CY, FIELD_RADIUS * 0.85,
    FIELD_CX, FIELD_CY, FIELD_RADIUS
  );
  edgeShadow.addColorStop(0, "rgba(0,0,0,0)");
  edgeShadow.addColorStop(1, `rgba(0,0,0,${T.edgeShadow})`);
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = edgeShadow;
  ctx.fill();

  // Field boundary ring (skip goal gap)
  const gStart = normalizeAngle(goalAngle - GOAL_ARC / 2);
  const gEnd   = normalizeAngle(goalAngle + GOAL_ARC / 2);

  ctx.save();
  ctx.shadowColor = T.boundary;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, gEnd, gStart);
  ctx.strokeStyle = T.boundary;
  ctx.lineWidth = 3.5;
  ctx.stroke();
  ctx.restore();

  // Halfway line
  ctx.beginPath();
  ctx.moveTo(FIELD_CX - FIELD_RADIUS + 10, FIELD_CY);
  ctx.lineTo(FIELD_CX + FIELD_RADIUS - 10, FIELD_CY);
  ctx.strokeStyle = T.lineColor;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, 42, 0, Math.PI * 2);
  ctx.strokeStyle = T.lineColor;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Center dot
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, 4, 0, Math.PI * 2);
  ctx.fillStyle = T.lineColor;
  ctx.fill();

  drawGoalGate();
}

function drawGoalGate() {
  const T = THEMES[timeOfDay] || THEMES.night;
  const gStart = goalAngle - GOAL_ARC / 2;
  const gEnd   = goalAngle + GOAL_ARC / 2;

  // Net backdrop
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, gStart, gEnd);
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS + GOAL_NET_DEPTH, gEnd, gStart, true);
  ctx.closePath();
  ctx.fillStyle = T.netTint;
  ctx.fill();

  // Net mesh — radial lines
  ctx.strokeStyle = "rgba(255,255,255,0.2)";
  ctx.lineWidth = 0.8;
  const steps = 8;
  for (let i = 0; i <= steps; i++) {
    const a = gStart + (gEnd - gStart) * (i / steps);
    ctx.beginPath();
    ctx.moveTo(FIELD_CX + Math.cos(a) * FIELD_RADIUS, FIELD_CY + Math.sin(a) * FIELD_RADIUS);
    ctx.lineTo(FIELD_CX + Math.cos(a) * (FIELD_RADIUS + GOAL_NET_DEPTH), FIELD_CY + Math.sin(a) * (FIELD_RADIUS + GOAL_NET_DEPTH));
    ctx.stroke();
  }
  // Net mesh — concentric arcs
  for (let j = 1; j <= 3; j++) {
    ctx.beginPath();
    ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS + GOAL_NET_DEPTH * (j / 4), gStart, gEnd);
    ctx.stroke();
  }

  // Outer net border
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS + GOAL_NET_DEPTH, gStart, gEnd);
  ctx.strokeStyle = T.netBorder;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Goal line
  ctx.save();
  ctx.shadowColor = T.goalGlow;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, gStart, gEnd);
  ctx.strokeStyle = T.goalLine;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();

  // Goal posts
  const p1x = FIELD_CX + Math.cos(gStart) * FIELD_RADIUS;
  const p1y = FIELD_CY + Math.sin(gStart) * FIELD_RADIUS;
  const p2x = FIELD_CX + Math.cos(gEnd)   * FIELD_RADIUS;
  const p2y = FIELD_CY + Math.sin(gEnd)   * FIELD_RADIUS;

  [{ x: p1x, y: p1y }, { x: p2x, y: p2y }].forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x + 1, p.y + 1, 7, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fill();
    const postGrad = ctx.createRadialGradient(p.x - 2, p.y - 2, 1, p.x, p.y, 7);
    postGrad.addColorStop(0, T.postFill1);
    postGrad.addColorStop(1, T.postFill2);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = postGrad;
    ctx.fill();
    ctx.strokeStyle = T.postStroke;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });
}

// ─── Scoreboard & UI ────────────────────────────────────────────
function getMatchMinute(elapsed) {
  // Map real elapsed seconds (0→MATCH_DURATION) to football minutes (0→90)
  return Math.min(MATCH_MINUTES, Math.floor((elapsed / MATCH_DURATION) * MATCH_MINUTES));
}

function updateScoreboard(elapsed) {
  if (!teamAData || !teamBData) { scoreboard.innerHTML = ""; return; }
  const minute = getMatchMinute(elapsed);

  scoreboard.innerHTML = `
    <span class="team-score">
      <span class="dot" style="background:${teamAData.color}"></span>
      ${teamAData.name} ${scoreA}
    </span>
    <span class="timer">${minute}'</span>
    <span class="team-score">
      ${scoreB} ${teamBData.name}
      <span class="dot" style="background:${teamBData.color}"></span>
    </span>
  `;
}

    mA: { x: marbleA.x, y: marbleA.y },

    goalAngle,
    scoreA,
    scoreB,

  });
}

// ─── Game Loop ──────────────────────────────────────────────────
function gameLoop(timestamp) {
  if (!gameRunning) return;

  if (!lastTimestamp) lastTimestamp = timestamp;
  const delta = timestamp - lastTimestamp;

  if (delta >= FRAME_MS) {
    lastTimestamp = timestamp;
    matchTimer += delta / 1000;

    // Rotate goal
    goalAngle += GOAL_SPEED;

    // Goal cooldown
    if (goalCooldown > 0) {
      goalCooldown--;
      drawField();
      marbleA.draw();
      marbleB.draw();
      updateScoreboard(matchTimer);
      recordFrame();
      animFrameId = requestAnimationFrame(gameLoop);
      return;
    }

    // AI + Update
    marbleA.think();
    marbleB.think();
    marbleA.update();
    marbleB.update();

    // Marble ↔ marble collision
    resolveElasticCollision(marbleA, marbleB);

    // Check scoring (only if team and total haven't reached max)
    const totalGoals = scoreA + scoreB;
    const canScoreA = scoreA < MAX_GOALS && totalGoals < MAX_TOTAL_GOALS;
    const canScoreB = scoreB < MAX_GOALS && totalGoals < MAX_TOTAL_GOALS;
    const resultA = constrainMarbleOrScore(marbleA, canScoreA);
    const resultB = constrainMarbleOrScore(marbleB, canScoreB);

    if (resultA) {
      scoreA++;
      const minute = getMatchMinute(matchTimer);
      replayData.goals.push({ frame: replayData.frames.length, team: teamAData.name, minute });
      showGoalFlash();
      logEvent(`GOL! ${teamAData.name} segna al ${minute}'! (${scoreA} - ${scoreB})`);
      marbleA.respawn();
      marbleB.respawn();
      goalCooldown = 50;
    } else if (resultB) {
      scoreB++;
      const minute = getMatchMinute(matchTimer);
      replayData.goals.push({ frame: replayData.frames.length, team: teamBData.name, minute });
      showGoalFlash();
      logEvent(`GOL! ${teamBData.name} segna al ${minute}'! (${scoreA} - ${scoreB})`);
      marbleA.respawn();
      marbleB.respawn();
      goalCooldown = 50;
    }

    // Draw
    drawField();
    marbleA.draw();
    marbleB.draw();

    updateScoreboard(matchTimer);
    recordFrame();

    if (matchTimer >= MATCH_DURATION) {
      endMatch();
      return;
    }
  }

  animFrameId = requestAnimationFrame(gameLoop);
}

// ─── Start / End Match ──────────────────────────────────────────
function startMatch() {
  if (selA.value === selB.value) {
    logEvent("Seleziona due squadre diverse!");
    return;
  }

  cancelAnimationFrame(animFrameId);
  cancelAnimationFrame(replayAnimId);
  replayPlaying = false;
  replayDiv.style.display = "none";

  teamAData = teams[parseInt(selA.value)];
  teamBData = teams[parseInt(selB.value)];
  timeOfDay = selTime.value;

  const distFromCenter = FIELD_RADIUS * 0.4;
  marbleA = new Marble(teamAData, FIELD_CX - distFromCenter, FIELD_CY);
  marbleB = new Marble(teamBData, FIELD_CX + distFromCenter, FIELD_CY);

  scoreA = 0;
  scoreB = 0;
  matchTimer = 0;
  lastTimestamp = 0;
  goalAngle = 0;
  goalCooldown = 0;

  replayData = {
    teams: { a: teamAData.name, b: teamBData.name },
    frames: [],
    goals: []
  };

  gameRunning = true;
  btnStart.disabled = true;
  btnDL.disabled = true;
  selA.disabled = true;
  selB.disabled = true;

  logEvent(`${teamAData.name} vs ${teamBData.name} — Via!`);
  animFrameId = requestAnimationFrame(gameLoop);
}

function endMatch() {
  gameRunning = false;
  btnStart.disabled = false;
  btnDL.disabled = false;
  selA.disabled = false;
  selB.disabled = false;

  let result;
  if (scoreA > scoreB) result = `${teamAData.name} vince!`;
  else if (scoreB > scoreA) result = `${teamBData.name} vince!`;
  else result = "Pareggio!";

  logEvent(`Fine partita! ${teamAData.name} ${scoreA} - ${scoreB} ${teamBData.name}. ${result}`);

  replayDiv.style.display = "flex";
  replaySlider.max = replayData.frames.length - 1;
  replaySlider.value = 0;
  replayIdx = 0;
}

btnStart.addEventListener("click", startMatch);

// ─── Replay System ──────────────────────────────────────────────
function drawReplayFrame(idx) {
  if (idx < 0 || idx >= replayData.frames.length) return;
  const f = replayData.frames[idx];

  goalAngle = f.goalAngle;
  marbleA.x = f.mA.x;
  marbleA.y = f.mA.y;
  marbleB.x = f.mB.x;
  marbleB.y = f.mB.y;

  drawField();
  marbleA.draw();
  marbleB.draw();

  scoreA = f.scoreA;
  scoreB = f.scoreB;
  updateScoreboard(f.time);

  const minute = getMatchMinute(f.time);
  replayTimeEl.textContent = `${minute}'`;
}

function replayLoop() {
  if (!replayPlaying) return;
  if (replayIdx >= replayData.frames.length) {
    replayPlaying = false;
    return;
  }
  drawReplayFrame(replayIdx);
  replaySlider.value = replayIdx;
  replayIdx++;
  replayAnimId = requestAnimationFrame(replayLoop);
}

btnReplayPlay.addEventListener("click", () => {
  if (replayData.frames.length === 0) return;
  replayPlaying = true;
  if (replayIdx >= replayData.frames.length) replayIdx = 0;
  replayLoop();
});

btnReplayPause.addEventListener("click", () => {
  replayPlaying = false;
  cancelAnimationFrame(replayAnimId);
});

replaySlider.addEventListener("input", () => {
  replayPlaying = false;
  cancelAnimationFrame(replayAnimId);
  replayIdx = parseInt(replaySlider.value);
  drawReplayFrame(replayIdx);
});

// ─── JSON Export ────────────────────────────────────────────────
btnDL.addEventListener("click", () => {
  if (replayData.frames.length === 0) return;

  const exportData = {
    match: `${replayData.teams.a} vs ${replayData.teams.b}`,
    finalScore: { [replayData.teams.a]: scoreA, [replayData.teams.b]: scoreB },
    duration: MATCH_DURATION,
    goals: replayData.goals,
    frames: replayData.frames
  };

  const blob = new Blob([JSON.stringify(exportData)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `replay_${replayData.teams.a}_vs_${replayData.teams.b}_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

// ─── Time-of-day preview ────────────────────────────────────────
selTime.addEventListener("change", () => {
  if (!gameRunning) {
    timeOfDay = selTime.value;
    drawField();
  }
});

// ─── Initial Draw ───────────────────────────────────────────────
timeOfDay = selTime.value;
drawField();
updateScoreboard(0);
logEvent("Seleziona le squadre e premi 'Gioca partita'");
</script>
