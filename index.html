<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Marble Race</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    select, button {
      font-size: 1rem;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    select {
      background: #16213e;
      color: #eee;
      border: 1px solid #0f3460;
    }

    button {
      background: #0f3460;
      color: #eee;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) { background: #e94560; }
    button:disabled { opacity: 0.4; cursor: default; }

    .vs { font-weight: 700; font-size: 1.1rem; }

    .scoreboard {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 1.4rem;
      font-weight: 700;
      min-height: 40px;
    }

    .scoreboard .team-score {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scoreboard .team-score .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-block;
    }

    .scoreboard .timer {
      font-size: 1.1rem;
      color: #aaa;
      min-width: 50px;
      text-align: center;
    }

    canvas {
      border: 3px solid #333;
      border-radius: 12px;
      background: #111;
      display: block;
      max-width: 100%;
    }

    .replay-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .replay-controls input[type="range"] {
      width: 300px;
      accent-color: #e94560;
    }

    .goal-flash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px rgba(255,255,255,0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
    }

    .goal-flash.visible { opacity: 1; }

    .match-log {
      margin-top: 12px;
      max-width: 520px;
      width: 100%;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>Football Marble Race</h1>

<div class="controls">
  <select id="teamA"></select>
  <span class="vs">VS</span>
  <select id="teamB"></select>
  <button id="start">Gioca partita</button>
  <button id="downloadReplay" disabled>Scarica Replay</button>
</div>

<div class="scoreboard" id="scoreboard"></div>

<canvas id="game" width="520" height="560"></canvas>

<div class="replay-controls" id="replayControls" style="display:none;">
  <button id="replayPlay">Riproduci</button>
  <button id="replayPause">Pausa</button>
  <input type="range" id="replaySlider" min="0" max="100" value="0" />
  <span id="replayTime">0:00</span>
</div>

<div class="goal-flash" id="goalFlash">GOL!</div>
<div class="match-log" id="matchLog"></div>

<script>
// ─── Configuration ──────────────────────────────────────────────
const MATCH_DURATION = 50;            // real seconds the match lasts
const MATCH_MINUTES = 90;             // simulated football minutes (0' → 90')
const MARBLE_RADIUS = 26;
const MAX_GOALS = 3;          // max goals per team
const FPS = 60;
const FRAME_MS = 1000 / FPS;

// Circular field (offset Y for title text)
const TITLE_HEIGHT = 36;
const FIELD_CX = 260;
const FIELD_CY = 260 + TITLE_HEIGHT;
const FIELD_RADIUS = 220;

// Rotating goal — narrower arc for fewer goals
const GOAL_ARC = 0.32;
const GOAL_SPEED = (2 * Math.PI) / (10 * FPS);
const GOAL_NET_DEPTH = 32;

// ─── Teams with official logo URLs (football-data.org crests) ───
const teams = [
  { name: "Milan",      color: "#AC1E2D", accent: "#000",    power: 1.00, logoUrl: "https://crests.football-data.org/98.png" },
  { name: "Inter",      color: "#0055A4", accent: "#000",    power: 1.05, logoUrl: "https://crests.football-data.org/108.png" },
  { name: "Juventus",   color: "#000000", accent: "#fff",    power: 1.03, logoUrl: "https://crests.football-data.org/109.png" },
  { name: "Roma",       color: "#8E1F2F", accent: "#F0BC42", power: 0.98, logoUrl: "https://crests.football-data.org/100.png" },
  { name: "Napoli",     color: "#1E90FF", accent: "#fff",    power: 1.04, logoUrl: "https://crests.football-data.org/113.png" },
  { name: "Lazio",      color: "#87CEEB", accent: "#1C2C5B", power: 0.97, logoUrl: "https://crests.football-data.org/110.png" },
  { name: "Fiorentina", color: "#6A0DAD", accent: "#fff",    power: 0.96, logoUrl: "https://crests.football-data.org/99.png" },
  { name: "Atalanta",   color: "#1C1C1C", accent: "#0074D9", power: 1.01, logoUrl: "https://crests.football-data.org/102.png" },
  { name: "Torino",     color: "#8B0000", accent: "#fff",    power: 0.95, logoUrl: "https://crests.football-data.org/586.png" },
  { name: "Bologna",    color: "#A41E35", accent: "#1B3D6D", power: 0.94, logoUrl: "https://crests.football-data.org/103.png" },
];

// Pre-load all logo images
teams.forEach(t => {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = t.logoUrl;
  t.logoImg = img;
  t.logoLoaded = false;
  img.onload = () => { t.logoLoaded = true; };
});

// ─── DOM ────────────────────────────────────────────────────────
const canvas   = document.getElementById("game");
const ctx      = canvas.getContext("2d");
const selA     = document.getElementById("teamA");
const selB     = document.getElementById("teamB");
const btnStart = document.getElementById("start");
const btnDL    = document.getElementById("downloadReplay");
const scoreboard   = document.getElementById("scoreboard");
const goalFlashEl  = document.getElementById("goalFlash");
const matchLogEl   = document.getElementById("matchLog");
const replayDiv    = document.getElementById("replayControls");
const replaySlider = document.getElementById("replaySlider");
const replayTimeEl = document.getElementById("replayTime");
const btnReplayPlay  = document.getElementById("replayPlay");
const btnReplayPause = document.getElementById("replayPause");

// Populate selectors
teams.forEach((t, i) => {
  selA.appendChild(new Option(t.name, i));
  selB.appendChild(new Option(t.name, i));
});
selB.value = 1;

// ─── Game State ─────────────────────────────────────────────────
let gameRunning = false;
let animFrameId = null;
let matchTimer  = 0;
let lastTimestamp = 0;
let scoreA = 0;
let scoreB = 0;
let goalAngle = 0;
let marbleA = null;
let marbleB = null;
let goalCooldown = 0;
let teamAData = null;
let teamBData = null;

// ─── Replay Data ────────────────────────────────────────────────
let replayData = { teams: {}, frames: [], goals: [] };
let replayIdx  = 0;
let replayPlaying = false;
let replayAnimId  = null;

// ─── Angle Helpers ──────────────────────────────────────────────
function normalizeAngle(a) {
  a = a % (2 * Math.PI);
  if (a < 0) a += 2 * Math.PI;
  return a;
}

function angleDiff(a, b) {
  let d = normalizeAngle(a) - normalizeAngle(b);
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

function isAngleInGoal(angle) {
  return Math.abs(angleDiff(angle, goalAngle)) < GOAL_ARC / 2;
}

// ─── Marble ─────────────────────────────────────────────────────
class Marble {
  constructor(team, startX, startY) {
    this.team = team;
    this.radius = MARBLE_RADIUS;
    this.startX = startX;
    this.startY = startY;
    this.x = startX;
    this.y = startY;
    // Launch with strong random velocity
    const a = Math.random() * Math.PI * 2;
    const spd = 5 + Math.random() * 3;
    this.vx = Math.cos(a) * spd;
    this.vy = Math.sin(a) * spd;
    this.targetX = startX;
    this.targetY = startY;
    this.thinkTimer = 0;
  }

  respawn() {
    this.x = this.startX;
    this.y = this.startY;
    const a = Math.random() * Math.PI * 2;
    const spd = 5 + Math.random() * 3;
    this.vx = Math.cos(a) * spd;
    this.vy = Math.sin(a) * spd;
    this.thinkTimer = 0;
  }

  think() {
    this.thinkTimer--;
    if (this.thinkTimer > 0) return;
    this.thinkTimer = Math.floor(40 + Math.random() * 60);

    // Completely random target — no goal seeking at all
    const randAngle = Math.random() * Math.PI * 2;
    const randDist = Math.random() * FIELD_RADIUS * 0.85;
    this.targetX = FIELD_CX + Math.cos(randAngle) * randDist;
    this.targetY = FIELD_CY + Math.sin(randAngle) * randDist;
  }

  update() {
    // Tiny nudge toward target — marbles coast on momentum
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 1) {
      const accel = 0.08 * this.team.power;
      this.vx += (dx / dist) * accel;
      this.vy += (dy / dist) * accel;
    }

    // Speed cap (high — springs launch fast)
    const maxSpeed = 9 * this.team.power;
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > maxSpeed) {
      this.vx = (this.vx / speed) * maxSpeed;
      this.vy = (this.vy / speed) * maxSpeed;
    }

    // No gravity, near-zero friction — marbles keep full momentum
    this.vx *= 0.999;
    this.vy *= 0.999;

    this.x += this.vx;
    this.y += this.vy;
  }

  draw() {
    const r = this.radius;

    // Shadow
    ctx.beginPath();
    ctx.arc(this.x + 2, this.y + 2, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fill();

    // 3D gradient body
    const grad = ctx.createRadialGradient(
      this.x - r * 0.3, this.y - r * 0.3, r * 0.1,
      this.x, this.y, r
    );
    grad.addColorStop(0, lightenColor(this.team.color, 60));
    grad.addColorStop(1, this.team.color);

    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Official logo image (or fallback initial)
    if (this.team.logoLoaded) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, r * 0.72, 0, Math.PI * 2);
      ctx.clip();
      const imgSize = r * 1.44;
      ctx.drawImage(this.team.logoImg, this.x - imgSize / 2, this.y - imgSize / 2, imgSize, imgSize);
      ctx.restore();
    } else {
      // Fallback: team initial
      ctx.fillStyle = this.team.accent;
      ctx.font = `bold ${r * 0.9}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(this.team.name[0], this.x, this.y);
    }

    // Shine highlight
    ctx.beginPath();
    ctx.arc(this.x - r * 0.28, this.y - r * 0.28, r * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.fill();
  }
}

// ─── Color Helper ───────────────────────────────────────────────
function lightenColor(hex, amount) {
  const num = parseInt(hex.replace("#", ""), 16);
  const r = Math.min(255, (num >> 16) + amount);
  const g = Math.min(255, ((num >> 8) & 0xFF) + amount);
  const b = Math.min(255, (num & 0xFF) + amount);
  return `rgb(${r},${g},${b})`;
}

// ─── Circular Field Constraint (spring walls) ───────────────────
const SPRING_BOOST = 1.15;        // walls ADD 15% energy on bounce
const MIN_BOUNCE_SPEED = 4.5;     // minimum speed after wall hit

function constrainMarbleOrScore(marble, canScore) {
  const dx = marble.x - FIELD_CX;
  const dy = marble.y - FIELD_CY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const maxDist = FIELD_RADIUS - marble.radius;

  if (dist > maxDist) {
    const angle = Math.atan2(dy, dx);

    // Score if exiting through the goal gap and team hasn't reached max
    if (canScore && isAngleInGoal(angle)) {
      return marble;
    }

    // Push marble back onto the wall edge
    const nx = dx / dist;
    const ny = dy / dist;
    marble.x = FIELD_CX + nx * maxDist;
    marble.y = FIELD_CY + ny * maxDist;

    // Reflect velocity off wall normal
    const dot = marble.vx * nx + marble.vy * ny;
    marble.vx -= 2 * dot * nx;
    marble.vy -= 2 * dot * ny;

    // SPRING effect: boost speed on every bounce (walls add energy)
    marble.vx *= SPRING_BOOST;
    marble.vy *= SPRING_BOOST;

    // Guarantee a minimum launch speed so marbles always fly across
    const speed = Math.sqrt(marble.vx * marble.vx + marble.vy * marble.vy);
    if (speed < MIN_BOUNCE_SPEED) {
      const scale = MIN_BOUNCE_SPEED / (speed || 1);
      marble.vx *= scale;
      marble.vy *= scale;
    }
  }
  return null;
}

// ─── Circle Collision ───────────────────────────────────────────
function resolveElasticCollision(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const minDist = a.radius + b.radius;
  if (dist >= minDist || dist === 0) return;

  const nx = dx / dist;
  const ny = dy / dist;

  const overlap = (minDist - dist) / 2;
  a.x -= nx * overlap;
  a.y -= ny * overlap;
  b.x += nx * overlap;
  b.y += ny * overlap;

  const dvx = a.vx - b.vx;
  const dvy = a.vy - b.vy;
  const relNormal = dvx * nx + dvy * ny;
  if (relNormal < 0) return;

  // Super-elastic collision (spring-like, adds energy)
  const bounce = 1.2;
  a.vx -= bounce * relNormal * nx;
  a.vy -= bounce * relNormal * ny;
  b.vx += bounce * relNormal * nx;
  b.vy += bounce * relNormal * ny;
}

// ─── Drawing ────────────────────────────────────────────────────
function drawField() {
  // Dark background
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Title text above field
  ctx.font = "bold 22px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#FFD700";
  ctx.fillText("kingofmarble10", FIELD_CX, TITLE_HEIGHT / 2 + 2);

  // Field grass
  const grassGrad = ctx.createRadialGradient(
    FIELD_CX, FIELD_CY, 0,
    FIELD_CX, FIELD_CY, FIELD_RADIUS
  );
  grassGrad.addColorStop(0, "#0d7a2b");
  grassGrad.addColorStop(1, "#085a1e");

  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = grassGrad;
  ctx.fill();

  // Field boundary ring (skip goal gap)
  const gStart = normalizeAngle(goalAngle - GOAL_ARC / 2);
  const gEnd   = normalizeAngle(goalAngle + GOAL_ARC / 2);

  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, gEnd, gStart);
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 4;
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, 36, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(255,255,255,0.15)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Center dot
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, 4, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.fill();

  drawGoalGate();
}

function drawGoalGate() {
  const gStart = goalAngle - GOAL_ARC / 2;
  const gEnd   = goalAngle + GOAL_ARC / 2;

  // Net backdrop (larger, semi-transparent)
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, gStart, gEnd);
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS + GOAL_NET_DEPTH, gEnd, gStart, true);
  ctx.closePath();
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  ctx.fill();

  // Net mesh — radial lines
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  const steps = 8;
  for (let i = 0; i <= steps; i++) {
    const a = gStart + (gEnd - gStart) * (i / steps);
    ctx.beginPath();
    ctx.moveTo(FIELD_CX + Math.cos(a) * FIELD_RADIUS, FIELD_CY + Math.sin(a) * FIELD_RADIUS);
    ctx.lineTo(FIELD_CX + Math.cos(a) * (FIELD_RADIUS + GOAL_NET_DEPTH), FIELD_CY + Math.sin(a) * (FIELD_RADIUS + GOAL_NET_DEPTH));
    ctx.stroke();
  }
  // Net mesh — concentric arcs
  for (let j = 1; j <= 3; j++) {
    ctx.beginPath();
    ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS + GOAL_NET_DEPTH * (j / 4), gStart, gEnd);
    ctx.stroke();
  }

  // Outer net border
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS + GOAL_NET_DEPTH, gStart, gEnd);
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Goal line (opening arc)
  ctx.beginPath();
  ctx.arc(FIELD_CX, FIELD_CY, FIELD_RADIUS, gStart, gEnd);
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.stroke();

  // White goal posts (larger, white with shadow)
  const p1x = FIELD_CX + Math.cos(gStart) * FIELD_RADIUS;
  const p1y = FIELD_CY + Math.sin(gStart) * FIELD_RADIUS;
  const p2x = FIELD_CX + Math.cos(gEnd)   * FIELD_RADIUS;
  const p2y = FIELD_CY + Math.sin(gEnd)   * FIELD_RADIUS;

  [{ x: p1x, y: p1y }, { x: p2x, y: p2y }].forEach(p => {
    // Shadow
    ctx.beginPath();
    ctx.arc(p.x + 1, p.y + 1, 7, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fill();
    // Post
    ctx.beginPath();
    ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.strokeStyle = "#ccc";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });
}

// ─── Scoreboard & UI ────────────────────────────────────────────
function getMatchMinute(elapsed) {
  // Map real elapsed seconds (0→MATCH_DURATION) to football minutes (0→90)
  return Math.min(MATCH_MINUTES, Math.floor((elapsed / MATCH_DURATION) * MATCH_MINUTES));
}

function updateScoreboard(elapsed) {
  if (!teamAData || !teamBData) { scoreboard.innerHTML = ""; return; }
  const minute = getMatchMinute(elapsed);

  scoreboard.innerHTML = `
    <span class="team-score">
      <span class="dot" style="background:${teamAData.color}"></span>
      ${teamAData.name} ${scoreA}
    </span>
    <span class="timer">${minute}'</span>
    <span class="team-score">
      ${scoreB} ${teamBData.name}
      <span class="dot" style="background:${teamBData.color}"></span>
    </span>
  `;
}

function showGoalFlash() {
  goalFlashEl.classList.add("visible");
  setTimeout(() => goalFlashEl.classList.remove("visible"), 1200);
}

function logEvent(msg) {
  matchLogEl.textContent = msg;
}

// ─── Record Frame ───────────────────────────────────────────────
function recordFrame() {
  replayData.frames.push({
    mA: { x: marbleA.x, y: marbleA.y },
    mB: { x: marbleB.x, y: marbleB.y },
    goalAngle,
    scoreA,
    scoreB,
    time: matchTimer
  });
}

// ─── Game Loop ──────────────────────────────────────────────────
function gameLoop(timestamp) {
  if (!gameRunning) return;

  if (!lastTimestamp) lastTimestamp = timestamp;
  const delta = timestamp - lastTimestamp;

  if (delta >= FRAME_MS) {
    lastTimestamp = timestamp;
    matchTimer += delta / 1000;

    // Rotate goal
    goalAngle += GOAL_SPEED;

    // Goal cooldown
    if (goalCooldown > 0) {
      goalCooldown--;
      drawField();
      marbleA.draw();
      marbleB.draw();
      updateScoreboard(matchTimer);
      recordFrame();
      animFrameId = requestAnimationFrame(gameLoop);
      return;
    }

    // AI + Update
    marbleA.think();
    marbleB.think();
    marbleA.update();
    marbleB.update();

    // Marble ↔ marble collision
    resolveElasticCollision(marbleA, marbleB);

    // Check scoring (only if team hasn't reached MAX_GOALS)
    const resultA = constrainMarbleOrScore(marbleA, scoreA < MAX_GOALS);
    const resultB = constrainMarbleOrScore(marbleB, scoreB < MAX_GOALS);

    if (resultA) {
      scoreA++;
      const minute = getMatchMinute(matchTimer);
      replayData.goals.push({ frame: replayData.frames.length, team: teamAData.name, minute });
      showGoalFlash();
      logEvent(`GOL! ${teamAData.name} segna al ${minute}'! (${scoreA} - ${scoreB})`);
      marbleA.respawn();
      marbleB.respawn();
      goalCooldown = 50;
    } else if (resultB) {
      scoreB++;
      const minute = getMatchMinute(matchTimer);
      replayData.goals.push({ frame: replayData.frames.length, team: teamBData.name, minute });
      showGoalFlash();
      logEvent(`GOL! ${teamBData.name} segna al ${minute}'! (${scoreA} - ${scoreB})`);
      marbleA.respawn();
      marbleB.respawn();
      goalCooldown = 50;
    }

    // Draw
    drawField();
    marbleA.draw();
    marbleB.draw();

    updateScoreboard(matchTimer);
    recordFrame();

    if (matchTimer >= MATCH_DURATION) {
      endMatch();
      return;
    }
  }

  animFrameId = requestAnimationFrame(gameLoop);
}

// ─── Start / End Match ──────────────────────────────────────────
function startMatch() {
  if (selA.value === selB.value) {
    logEvent("Seleziona due squadre diverse!");
    return;
  }

  cancelAnimationFrame(animFrameId);
  cancelAnimationFrame(replayAnimId);
  replayPlaying = false;
  replayDiv.style.display = "none";

  teamAData = teams[parseInt(selA.value)];
  teamBData = teams[parseInt(selB.value)];

  const distFromCenter = FIELD_RADIUS * 0.4;
  marbleA = new Marble(teamAData, FIELD_CX - distFromCenter, FIELD_CY);
  marbleB = new Marble(teamBData, FIELD_CX + distFromCenter, FIELD_CY);

  scoreA = 0;
  scoreB = 0;
  matchTimer = 0;
  lastTimestamp = 0;
  goalAngle = 0;
  goalCooldown = 0;

  replayData = {
    teams: { a: teamAData.name, b: teamBData.name },
    frames: [],
    goals: []
  };

  gameRunning = true;
  btnStart.disabled = true;
  btnDL.disabled = true;
  selA.disabled = true;
  selB.disabled = true;

  logEvent(`${teamAData.name} vs ${teamBData.name} — Via!`);
  animFrameId = requestAnimationFrame(gameLoop);
}

function endMatch() {
  gameRunning = false;
  btnStart.disabled = false;
  btnDL.disabled = false;
  selA.disabled = false;
  selB.disabled = false;

  let result;
  if (scoreA > scoreB) result = `${teamAData.name} vince!`;
  else if (scoreB > scoreA) result = `${teamBData.name} vince!`;
  else result = "Pareggio!";

  logEvent(`Fine partita! ${teamAData.name} ${scoreA} - ${scoreB} ${teamBData.name}. ${result}`);

  replayDiv.style.display = "flex";
  replaySlider.max = replayData.frames.length - 1;
  replaySlider.value = 0;
  replayIdx = 0;
}

btnStart.addEventListener("click", startMatch);

// ─── Replay System ──────────────────────────────────────────────
function drawReplayFrame(idx) {
  if (idx < 0 || idx >= replayData.frames.length) return;
  const f = replayData.frames[idx];

  goalAngle = f.goalAngle;
  marbleA.x = f.mA.x;
  marbleA.y = f.mA.y;
  marbleB.x = f.mB.x;
  marbleB.y = f.mB.y;

  drawField();
  marbleA.draw();
  marbleB.draw();

  scoreA = f.scoreA;
  scoreB = f.scoreB;
  updateScoreboard(f.time);

  const minute = getMatchMinute(f.time);
  replayTimeEl.textContent = `${minute}'`;
}

function replayLoop() {
  if (!replayPlaying) return;
  if (replayIdx >= replayData.frames.length) {
    replayPlaying = false;
    return;
  }
  drawReplayFrame(replayIdx);
  replaySlider.value = replayIdx;
  replayIdx++;
  replayAnimId = requestAnimationFrame(replayLoop);
}

btnReplayPlay.addEventListener("click", () => {
  if (replayData.frames.length === 0) return;
  replayPlaying = true;
  if (replayIdx >= replayData.frames.length) replayIdx = 0;
  replayLoop();
});

btnReplayPause.addEventListener("click", () => {
  replayPlaying = false;
  cancelAnimationFrame(replayAnimId);
});

replaySlider.addEventListener("input", () => {
  replayPlaying = false;
  cancelAnimationFrame(replayAnimId);
  replayIdx = parseInt(replaySlider.value);
  drawReplayFrame(replayIdx);
});

// ─── JSON Export ────────────────────────────────────────────────
btnDL.addEventListener("click", () => {
  if (replayData.frames.length === 0) return;

  const exportData = {
    match: `${replayData.teams.a} vs ${replayData.teams.b}`,
    finalScore: { [replayData.teams.a]: scoreA, [replayData.teams.b]: scoreB },
    duration: MATCH_DURATION,
    goals: replayData.goals,
    frames: replayData.frames
  };

  const blob = new Blob([JSON.stringify(exportData)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `replay_${replayData.teams.a}_vs_${replayData.teams.b}_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

// ─── Initial Draw ───────────────────────────────────────────────
drawField();
updateScoreboard(0);
logEvent("Seleziona le squadre e premi 'Gioca partita'");
</script>

</body>
</html>
